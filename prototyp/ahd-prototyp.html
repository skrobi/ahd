<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Układ: narzędzie operacyjne – pasek środowiska u góry, nawigacja po lewej, obszar roboczy; przebieg = oś etapów + panel etapu + dziennik */
:root{
  --bg:#eef2f3; --surface:#ffffff; --surface-2:#e4eaec; --ink:#13212a; --muted:#566974; --line:#cfd9dd;
  --accent:#0a6a76; --accent-ink:#ffffff; --accent-soft:#d5ecee;
  --ok:#1d7648; --ok-soft:#dcefe4; --warn:#9a5c05; --warn-soft:#f6e8cf; --crit:#b0271f; --crit-soft:#f7dcd9;
  --info:#2c5a98; --info-soft:#dde7f5; --stale:#6c618f; --stale-soft:#e7e3f2;
  --shadow:0 1px 2px rgba(19,33,42,.06),0 4px 16px rgba(19,33,42,.06);
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-head:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1418; --surface:#141e24; --surface-2:#1b272e; --ink:#e1e9ec; --muted:#8fa2ab; --line:#29373f;
  --accent:#43b2bf; --accent-ink:#06181b; --accent-soft:#16333a;
  --ok:#55c08a; --ok-soft:#15301f; --warn:#e2a54a; --warn-soft:#352711; --crit:#f07a70; --crit-soft:#3a1a18;
  --info:#86aee8; --info-soft:#18263a; --stale:#aea3d6; --stale-soft:#262238;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0d1418; --surface:#141e24; --surface-2:#1b272e; --ink:#e1e9ec; --muted:#8fa2ab; --line:#29373f;
  --accent:#43b2bf; --accent-ink:#06181b; --accent-soft:#16333a;
  --ok:#55c08a; --ok-soft:#15301f; --warn:#e2a54a; --warn-soft:#352711; --crit:#f07a70; --crit-soft:#3a1a18;
  --info:#86aee8; --info-soft:#18263a; --stale:#aea3d6; --stale-soft:#262238;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark;}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
h1,h2,h3{font-family:var(--f-head);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.005em}
h1{font-size:1.6rem;line-height:1.2} h2{font-size:1.2rem} h3{font-size:1rem}
p{margin:0}
.mono{font-family:var(--f-mono);font-size:.86em}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Shell */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand b{font-family:var(--f-head);font-size:1.25rem;letter-spacing:.06em}
.brand span{color:var(--muted);font-size:.85rem}
.env{font-family:var(--f-mono);font-size:.75rem;padding:2px 8px;border-radius:4px;background:var(--warn-soft);color:var(--warn);font-weight:500;letter-spacing:.04em}
.who{display:flex;align-items:center;gap:8px;font-size:.85rem}
.who select{font:inherit;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:3px 6px;color:var(--ink)}
.shell{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:calc(100% - 52px)}
.nav{border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:2px;background:var(--surface)}
.nav button{all:unset;cursor:pointer;padding:8px 12px;border-radius:6px;display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);font-weight:500}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="true"]{background:var(--accent-soft);color:var(--ink)}
.nav button:focus-visible{outline:2px solid var(--accent)}
.nav .sep{height:1px;background:var(--line);margin:10px 4px}
.nav .foot{margin-top:auto;font-size:.75rem;color:var(--muted);padding:8px 12px;display:grid;gap:4px}
.count{font-family:var(--f-mono);font-size:.72rem;background:var(--surface-2);border-radius:10px;padding:0 7px;color:var(--muted)}
main{padding-block:24px 48px;padding-inline:clamp(16px,3vw,32px);min-width:0;display:flex;flex-direction:column;gap:20px}

/* Blocks */
.head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 20px;justify-content:space-between}
.head .sub{color:var(--muted);margin-top:4px}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel.flat{background:transparent;border-style:dashed}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:8px}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 14px;font-size:.9rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}

.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;min-height:36px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.small{padding:3px 10px;min-height:28px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.nodot::before{display:none}
.s-ok{background:var(--ok-soft);color:var(--ok)} .s-warn,.s-action{background:var(--warn-soft);color:var(--warn)}
.s-crit,.s-error{background:var(--crit-soft);color:var(--crit)} .s-info,.s-running{background:var(--info-soft);color:var(--info)}
.s-stale{background:var(--stale-soft);color:var(--stale)} .s-ready{background:var(--accent-soft);color:var(--accent)}
.s-done{background:var(--ok-soft);color:var(--ok)} .s-todo{background:var(--surface-2);color:var(--muted)}
.tag{font-family:var(--f-mono);font-size:.72rem;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:left;background:var(--surface-2)}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}

.note{border-left:3px solid var(--line);padding:8px 12px;background:var(--surface-2);border-radius:0 6px 6px 0;font-size:.9rem}
.note.warn{border-color:var(--warn);background:var(--warn-soft)}
.note.crit{border-color:var(--crit);background:var(--crit-soft)}
.note.ok{border-color:var(--ok);background:var(--ok-soft)}
.note.info{border-color:var(--info);background:var(--info-soft)}
.note.stale{border-color:var(--stale);background:var(--stale-soft)}

.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.checks li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;align-items:start}
.ic{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:.7rem;font-weight:700;margin-top:2px}
.ic.ok{background:var(--ok-soft);color:var(--ok)} .ic.warn{background:var(--warn-soft);color:var(--warn)} .ic.crit{background:var(--crit-soft);color:var(--crit)} .ic.todo{background:var(--surface-2);color:var(--muted)}

.tree{font-family:var(--f-mono);font-size:.8rem;line-height:1.7;white-space:pre;overflow-x:auto;background:var(--surface-2);border-radius:6px;padding:12px 14px;margin:0}

/* Zakres cards */
.zcard{cursor:pointer;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.zcard:hover{border-color:var(--accent)}
.zcard .code{font-family:var(--f-head);font-size:1.35rem;font-weight:600}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dot{width:18px;height:6px;border-radius:3px;background:var(--surface-2)}
.dot.done{background:var(--ok)} .dot.action,.dot.ready{background:var(--warn)} .dot.error{background:var(--crit)} .dot.running{background:var(--info)} .dot.stale{background:var(--stale)}

/* Run view */
.run-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.stepper{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.step{all:unset;cursor:pointer;flex:1 0 118px;border:1px solid var(--line);border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;background:var(--surface);min-width:118px}
.step:focus-visible{outline:2px solid var(--accent)}
.step .n{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.step .t{font-weight:600;font-size:.84rem;line-height:1.25}
.step .bar{height:4px;border-radius:2px;background:var(--surface-2)}
.step[aria-current="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.step.done .bar{background:var(--ok)} .step.action .bar,.step.ready .bar{background:var(--warn)} .step.error .bar{background:var(--crit)}
.step.running .bar{background:var(--info)} .step.stale .bar{background:var(--stale)}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;font-size:.84rem;max-height:560px;overflow:auto}
.log li{display:grid;gap:2px;border-left:2px solid var(--line);padding-left:10px}
.log .t{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.progress{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.progress i{display:block;height:100%;width:40%;background:var(--info);border-radius:3px;animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
@media (prefers-reduced-motion: reduce){.progress i{animation:none;width:100%;opacity:.6}}
.prov{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--surface-2)}
.prov span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.82rem}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* Forms / wizard */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-weight:600;font-size:.85rem}
.field .hint{font-size:.8rem;color:var(--muted)}
input[type=text],textarea,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;width:100%}
textarea{min-height:70px;resize:vertical}
.choice{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
.opt{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;background:var(--surface)}
.opt:focus-visible{outline:2px solid var(--accent)}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.opt b{font-family:var(--f-head);font-size:1rem}
.opt span{font-size:.82rem;color:var(--muted)}
.wsteps{display:flex;gap:4px;flex-wrap:wrap;list-style:none;padding:0;margin:0}
.wsteps li{font-size:.8rem;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.wsteps li.on{background:var(--accent);color:var(--accent-ink)}
.wsteps li.past{background:var(--accent-soft);color:var(--ink)}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:6px}
.chk input{margin-top:4px}
.chk.dis{opacity:.55}

/* Overlay */
.overlay{position:fixed;inset:0;background:rgba(10,20,25,.45);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:10px;border:1px solid var(--line);box-shadow:var(--shadow);width:min(640px,100%);max-height:90vh;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:16px}
.toast{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;box-shadow:var(--shadow);z-index:60;max-width:min(420px,calc(100% - 32px))}
.banner{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:8px;border:1px solid var(--stale);background:var(--stale-soft)}
.banner.lock{border-color:var(--info);background:var(--info-soft)}

@media (max-width:900px){
  .run-layout{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:760px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px 16px}
  .nav .sep,.nav .foot{display:none}
  .nav button{white-space:nowrap}
  .brand span{display:none}
}
</style>

<script>
/* ============================================================
   AHD – prototyp funkcjonalny. Wszystkie dane są PRZYKŁADOWE.

   w docelowym rozwiązaniu cały stan jest w centralnej bazie MS SQL.

const ROOT = '\\\\pzlfs01\\AHD';
const ME = 'Anna Wiśniewska';
const APP_VER = '0.3.0', SCHEMA_VER = 12;

const TYPES = {

};
const ST = {todo:'Oczekuje', ready:'Do wykonania', running:'W toku', action:'Wymaga akcji', done:'Zakończony', error:'Błąd', stale:'Nieaktualny'};

function stageDefs(type, kind){

    {k:'sap', n:'Pliki SAP', d:'Eksporty SAP kopiowane do Landing Zone z hashem.'},

    {k:'fin', n:'Pliki dla finansów', d:'Pliki pośrednie. Wymagają zatwierdzenia przez finanse.'},
  ];
  if(kind==='close') s.push(

    {k:'camval', n:'Walidacja zaawansowania', d:'Kontrola wartości i ich pochodzenia.'});
  s.push({k:'ev', n:'Generowanie EV', d:'Kalkulacja EV w bazie, nowa rewizja wyników.'});
  if(type==='SAC') s.push({k:'cobra', n:'Plik dla Cobra', d:'Eksport danych do Cobra dla Sikorsky.'});

/* ---------- dane przykładowe ---------- */

function seed(){

      cams:[['D. Wójcik',6],['H. Maj',5],['L. Czarnecki',4]],
      analysts:[ME,'Piotr Górski'], approver:'Tomasz Mazur', dicts:['struktura','harmonogram'], created:'01.08.2026 · P. Górski'}
  };
  const D = (id,name,scope,owner,file,versions,extra={})=>({id,name,scope,owner,file,versions,...extra});
  const dicts = {
    stawki:D('stawki','Stawki wydziałów','global','Finanse – T. Mazur','00_Global\\Slowniki\\Stawki_wydzialow.xlsx',
      [v(7,'01.09.2026','T. Mazur',184,'+6 / ~0 / zamk. 6','R-S70I-2026-09-T37'),v(6,'02.06.2026','T. Mazur',178,'+4 / ~2 / zamk. 0',''),v(5,'03.03.2026','T. Mazur',174,'+0 / ~3 / zamk. 0','')]),
    kalendarz:D('kalendarz','Kalendarz okresów','global','Finanse – T. Mazur','00_Global\\Slowniki\\Kalendarz_okresow.xlsx',
      [v(3,'05.01.2026','T. Mazur',24,'+12 / ~0 / zamk. 0','')]),
    cam:D('cam','Słownik CAM','global','PMO – K. Rogalska','00_Global\\Slowniki\\CAM.xlsx',
      [v(12,'15.09.2026','K. Rogalska',64,'+2 / ~1 / zamk. 1','R-F16-2026-09-T38'),v(11,'18.08.2026','K. Rogalska',63,'+1 / ~0 / zamk. 0','')]),

function curVer(s,id){ return s.dicts[id].versions[0]?.v ?? 0; }
function runId(z,kind,period,week){ return 'R-'+z+'-'+period+'-'+(kind==='close'?'Z':'T'+week); }
function mkRun(s,zid,kind,period,week,owner,opt={}){
  const z = s.zakresy[zid];
  const defs = stageDefs(z.type, kind);
  const id = runId(zid,kind,period,week);
  const pinned = {};
  for(const d of ['stawki','kalendarz','cam','przypisania','kursy']) pinned[d]=curVer(s,d);
  for(const d of z.dicts) pinned[zid+':'+d]=curVer(s,zid+':'+d);
  const st = {};
  let reached = !opt.upTo && !opt.allDone;
  defs.forEach((d,i)=>{
    if(opt.allDone) st[d.k]={s:'done'};
    else if(opt.upTo){
      if(reached) st[d.k]={s:'todo'};
      else if(d.k===opt.upTo){ st[d.k]={s:'action'}; reached=true; }
      else st[d.k]={s:'done'};
    } else st[d.k]={s: i===0?'ready':'todo'};
  });
  const r = {id, zid, kind, period, week, owner, started:opt.at||'29.09.2026', st, pinned, sel:null,
    log:[], ack:{}, flags:{}, fin:null, cams:null, fill:null, rev: opt.allDone?1:0, frozen: opt.allDone && kind==='close'};
  if(opt.upTo==='fin'){ r.fin={state:'pending'}; }
  if(opt.upTo==='fill'){ r.flags.prodDone=true; }
  r.log.push({t:(opt.at||'29.09.2026').slice(0,5)+' 08:31', who:owner, msg:'Rozpoczęto przebieg. Przypięto wersje słowników.'});
  if(opt.allDone) r.log.push({t:(opt.at||'').slice(0,5)+' 16:05', who:owner, msg: kind==='close'?'Zatwierdzono zamknięcie okresu. Przebieg zamrożony.':'Wygenerowano EV wstępne (R1).'});
  s.runs[id]=r;
  return r;
}

let S;

const $ = sel => document.querySelector(sel);
const esc = x => String(x ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = n => Number(n).toLocaleString('pl-PL');
function now(){ S.clock += 3; const h=Math.floor(S.clock/60)%24, m=S.clock%60; return '29.09 '+String(h).padStart(2,'0')+':'+String(m).padStart(2,'0'); }
function hash(str){ let h=2166136261; for(const c of str){ h^=c.charCodeAt(0); h=Math.imul(h,16777619);} return (h>>>0); }
function sha(str){ let a=hash(str), out=''; for(let i=0;i<8;i++){ a=Math.imul(a^(a>>>13),1274126177)>>>0; out+=a.toString(16).padStart(8,'0').slice(0,8);} return out; }
function pill(st, txt){ return `<span class="pill s-${st}">${esc(txt ?? ST[st] ?? st)}</span>`; }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>t.hidden=true,3200); }
function logRun(r,msg,who=ME){ const t=now(); r.log.unshift({t,who,msg}); S.events.unshift({t,who,z:S.zakresy[r.zid].code,msg}); }
function go(view){ S.view=view; S.modal=null; save(); render(); window.scrollTo({top:0}); }
function isFin(){ return S.role==='finanse'; }
function defsOf(r){ return stageDefs(S.zakresy[r.zid].type, r.kind); }
function runLabel(r){ return r.kind==='close' ? 'Zamknięcie '+r.period : 'Tydzień '+r.week+' · '+r.period; }
function runState(r){
  const defs=defsOf(r);
  if(defs.every(d=>r.st[d.k].s==='done')) return {s:'done', txt: r.frozen?'Zamknięty i zamrożony':'Zakończony'};
  const d = defs.find(d=>r.st[d.k].s!=='done');
  return {s:r.st[d.k].s, txt:d.n+' – '+ST[r.st[d.k].s].toLowerCase(), k:d.k};
}
function activeRuns(zid){ return Object.values(S.runs).filter(r=>r.zid===zid && runState(r).s!=='done'); }
function runsOf(zid){ return Object.values(S.runs).filter(r=>r.zid===zid).sort((a,b)=> (b.period+(b.week||99)).localeCompare(a.period+(a.week||99))); }
function newerFor(r){
  if(runState(r).s==='done') return [];
  return Object.entries(r.pinned).filter(([id,pv])=> S.dicts[id] && curVer(S,id)>pv && !r.ack[id+':'+curVer(S,id)]).map(([id,pv])=>({id,pv,cv:curVer(S,id)}));
}
function setSt(r,k,s,extra={}){ r.st[k]={...r.st[k],s,...extra}; }
function complete(r,k){
  const defs=defsOf(r), i=defs.findIndex(d=>d.k===k);
  setSt(r,k,'done');
  const nx=defs[i+1];
  if(nx && ['todo','stale'].includes(r.st[nx.k].s)) setSt(r,nx.k,'ready');
  if(nx) r.sel=nx.k;
}
function invalidateFrom(r,k){
  const defs=defsOf(r), i=defs.findIndex(d=>d.k===k);
  defs.forEach((d,j)=>{
    if(j===i) setSt(r,d.k,'ready');
    else if(j>i) setSt(r,d.k, ['done','action','error','running'].includes(r.st[d.k].s)?'stale':'todo');
  });
  r.sel=k;
}
function work(r,k,label,ms,fn){
  setSt(r,k,'running',{label}); render();
  setTimeout(()=>{ fn(); save(); render(); }, ms);
}
function canAct(r){ return r.owner===ME && !r.frozen; }

  if(w.step===4) body=`

     <dt>Projekty</dt><dd>${w.projects.map(p=>`<span class="tag">${p}</span>`).join(' ')||'<span class="muted">brak</span>'}</dd>

      ${z.dicts.map(d=>`<tr><td>${S.zd[d]}</td><td class="muted">zakres</td><td class="r mono">v${curVer(S,z.id+':'+d)}</td></tr>`).join('')}</tbody></table></div></div>

/* ---------- PRZEBIEG ---------- */
function vRun(id){
  const r=S.runs[id]; if(!r) return vPulpit();
  const z=S.zakresy[r.zid], defs=defsOf(r);
  if(!r.sel || !r.st[r.sel]) r.sel = (defs.find(d=>r.st[d.k].s!=='done')||defs[defs.length-1]).k;
  const def=defs.find(d=>d.k===r.sel), i=defs.indexOf(def), rs=runState(r);
  const newer=newerFor(r);
  const lock = r.owner!==ME && rs.s!=='done' ? `<div class="banner lock"><span>Przebieg prowadzi <b>${esc(r.owner)}</b> (ostatnia akcja: ${esc(r.log[0]?.t||'')}). Możesz podglądać, ale akcje są zablokowane.</span>
      ${S.takeover? `<span class="row"><span>Przejąć przebieg? ${esc(r.owner)} zobaczy to w dzienniku.</span><button class="btn small" data-a="takeoverNo">Nie</button><button class="btn small primary" data-a="takeoverYes">Przejmij</button></span>` : `<button class="btn small" data-a="takeover">Przejmij przebieg</button>`}</div>` : '';
  const nb = newer.length && r.owner===ME ? `<div class="banner"><span>${newer.map(n=>`Dostępna nowsza wersja: <b>${esc(S.dicts[n.id].name)}</b> v${n.cv} (przebieg używa v${n.pv}).`).join(' ')} Zmiana wersji unieważnia etapy od walidacji.</span>
      <span class="row"><button class="btn small" data-a="ackNewer">Kontynuuj na obecnej</button><button class="btn small primary" data-a="rebase">Przelicz od etapu 3</button></span></div>` : (newer.length? `<div class="note stale">Dostępna nowsza wersja słownika ${esc(newer.map(n=>S.dicts[n.id].name+' v'+n.cv).join(', '))}. Decyzję podejmuje prowadzący przebieg.</div>`:'');
  return `
  <div class="head"><div><div class="eyebrow"><a href="#" data-a="zakres" data-x="${z.id}">${esc(z.code)}</a> / przebieg</div>
    <h1>${esc(runLabel(r))}</h1><p class="sub"><span class="mono">${esc(r.id)}</span> · prowadzi ${esc(r.owner)}${r.owner===ME?' (Ty)':''} · start ${esc(r.started)}${r.rev?` · rewizja EV R${r.rev}`:''}</p></div>
    <div class="row">${r.kind==='weekly'?pill('info','EV wstępne'):pill('stale','Zamknięcie okresu')}${pill(rs.s, rs.s==='done'?(r.frozen?'Zamrożony':'Zakończony'):'W trakcie')}</div></div>
  ${lock}${nb}
  <nav class="stepper" aria-label="Etapy przebiegu">${defs.map((d,j)=>`<button class="step ${r.st[d.k].s}" data-a="sel" data-x="${d.k}" aria-current="${d.k===r.sel}"><span class="n">${String(j+1).padStart(2,'0')} · ${ST[r.st[d.k].s]}</span><span class="t">${d.n}</span><span class="bar"></span></button>`).join('')}</nav>
  <div class="run-layout">
    <section class="panel">
      <div class="row between"><div><div class="eyebrow">Etap ${i+1} z ${defs.length}</div><h2>${def.n}</h2><p class="muted">${def.d}</p></div>${pill(r.st[def.k].s)}</div>
      ${stagePanel(r,def)}
    </section>
    <aside class="stack">
      <section class="panel"><h3>Przypięte słowniki</h3><div class="tbl-wrap"><table><tbody>
        ${Object.entries(r.pinned).map(([d,pv])=>`<tr><td>${esc(S.dicts[d]?.name||d)}</td><td class="r mono">v${pv}${curVer(S,d)>pv?` <span style="color:var(--stale)">→ v${curVer(S,d)}</span>`:''}</td></tr>`).join('')}</tbody></table></div></section>
      <section class="panel"><h3>Dziennik przebiegu</h3><ul class="log">${r.log.map(l=>`<li><span class="t">${esc(l.t)} · ${esc(l.who)}</span><span>${esc(l.msg)}</span></li>`).join('')}</ul></section>
    </aside>
  </div>`;
}

function actBtn(r,a,label,primary=true,extra=''){ return `<button class="btn ${primary?'primary':''}" data-a="${a}" ${canAct(r)?'':'disabled'} ${extra}>${esc(label)}</button>`; }
function seedN(r,salt,min,max){ return min + hash(r.zid+salt)%(max-min+1); }

function stagePanel(r,def){
  const st=r.st[def.k].s, z=S.zakresy[r.zid];
  if(st==='running') return `<p>${esc(r.st[def.k].label||'Przetwarzanie…')}</p><div class="progress"><i></i></div>`;
  if(st==='todo') return `<div class="note">Etap czeka na zakończenie poprzednich etapów.</div>`;
  const staleNote = st==='stale' ? `<div class="note stale">Wynik etapu jest nieaktualny, bo zmieniły się dane wejściowe wcześniejszego etapu. Wykonaj ponownie etapy od pierwszego oznaczonego „Do wykonania”.</div>` : '';
  const P = STAGE[def.k];
  const defs=defsOf(r), nx=defs[defs.indexOf(def)+1];
  const next = st==='done' && nx && r.st[nx.k].s!=='done' ? `<div class="row"><button class="btn" data-a="sel" data-x="${nx.k}">Dalej: ${esc(nx.n)} →</button></div>` : '';
  return staleNote + (P? P(r,st,z) : '') + next;
}

const STAGE = {
  sap(r,st,z){
    const code=z.code, week=r.kind==='weekly'?'Tydz'+r.week:'Zamkniecie';
    const n1=seedN(r,'c1',420000,520000), n2=seedN(r,'c2',150000,240000);
    const files=[['CJI3_'+code+'_cz1.csv',n1,'CJI3 – koszty rzeczywiste'],['CJI3_'+code+'_cz2.csv',n2,'CJI3 – koszty rzeczywiste'],['ZRD_KKAJ_'+code+'.xlsx',seedN(r,'k',9000,22000),'ZRD_KKAJ'],['NetInv_'+code+'.xlsx',seedN(r,'n',1800,4200),'Net Inv']];
    const done=st==='done';
    return `<p class="muted">Folder: <span class="mono">Zakresy\\${esc(code)}\\SAP\\${r.period}\\${week}\\</span></p>
    <div class="tbl-wrap"><table><thead><tr><th>Plik</th><th>Źródło</th><th class="r">Wiersze</th><th>SHA-256</th></tr></thead><tbody>
    ${files.map(f=>`<tr><td class="mono">${esc(f[0])}</td><td>${f[2]}</td><td class="r">${nf(f[1])}</td><td class="mono">${done?sha(f[0]+r.id).slice(0,12)+'…':'—'}</td></tr>`).join('')}</tbody></table></div>
    <ul class="checks">
      <li><span class="ic ok">✓</span><span>Zestaw CJI3: 2 części (limit wierszy Excela), identyczny układ 34 kolumn, brak duplikatów między częściami, razem ${nf(n1+n2)} wierszy</span></li>
      <li><span class="ic ok">✓</span><span>Daty księgowania w okresie ${r.period}</span></li>
      <li><span class="ic ok">✓</span><span>Pliki nie są otwarte przez innego użytkownika (odczyt z kopii)</span></li>
    </ul>
    ${done?`<div class="note ok">Skopiowano do <span class="mono">01_LandingZone\\${esc(code)}\\${r.period}\\${esc(r.id)}\\</span>. Hash zapisany w bazie – zmiana pliku po imporcie zostanie wykryta.</div>`:
    `<div class="row">${actBtn(r,'doSap','Skopiuj do Landing Zone i zarejestruj')}</div>`}`;
  },
  dict(r,st,z){
    const changed = r.zid==='F16' && !r.flags.valFixed && !r.flags.keepOld;
    const rows = Object.entries(r.pinned).map(([id,pv])=>{
      const d=S.dicts[id]; const isZ=d.scope!=='global';
      let res = pill('ok','bez zmian');
      if(isZ && id==='F16:struktura' && st!=='ready') res = r.flags.valFixed? pill('ok','nowa wersja v'+pv) : r.flags.keepOld? pill('warn','kandydat odrzucony') : pill('warn','zmieniony – kandydat v'+(pv+1));
      return `<tr><td>${esc(d.name)}</td><td class="muted">${isZ?'zakres':'globalny'}</td><td class="mono" style="font-size:.78rem">${esc(d.file)}</td><td class="r mono">v${pv}</td><td>${st==='ready'?'<span class="muted">—</span>':res}</td></tr>`;
    }).join('');
    return `<p>Globalne słowniki są tylko przypinane. Słowniki zakresu są importowane: plik bez zmian (ten sam hash) nie tworzy nowej wersji.</p>
      <div class="tbl-wrap"><table><thead><tr><th>Słownik</th><th>Zasięg</th><th>Plik</th><th class="r">Wersja</th><th>Wynik</th></tr></thead><tbody>${rows}</tbody></table></div>
      ${st==='done'? (changed?'<div class="note warn">Wykryto zmianę w „Struktura projektowa”. Nowa wersja powstanie dopiero po poprawnej walidacji.</div>':'') : `<div class="row">${actBtn(r,'doDict','Importuj słowniki zakresu')}</div>`}`;
  },
  val(r,st,z){
    const f16 = r.zid==='F16';
    if(st==='ready') return `<p>Walidacja obejmuje pliki SAP i słowniki: strukturę, typy, klucze i okresy ważności, reguły biznesowe, odwołania między słownikami, wersjonowanie.</p><div class="row">${actBtn(r,'doVal','Uruchom walidację')}</div>`;
    const issues=[];
    if(f16 && !r.flags.valFixed && !r.flags.keepOld) issues.push(['crit','Struktura projektowa','214','ValidFrom','Nakładające się okresy dla WBS P1S-F16-0412: 01.01.2026–31.12.2026 i 01.09.2026–(otwarty). Zamknij poprzedni okres (ValidTo) zamiast dodawać drugi wiersz.']);
    if(f16) issues.push(['warn','Struktura projektowa','88','CAM','Spacja na końcu wartości „J.KOWALSKI ”. Po oczyszczeniu dopasowano do słownika CAM.']);
    issues.push(['warn','Harmonogram i budżet','51','WP','Element z WP = no ma budżet godzinowy 120 h.']);
    issues.push(['warn','CJI3 cz. 2','—','Wydział',`2 wiersze z wydziałem W-417 bez stawki na rok 2026 (koszt 3 412,00 PLN).`]);
    const errs=issues.filter(i=>i[0]==='crit').length;
    const tbl=`<div class="tbl-wrap"><table><thead><tr><th>Waga</th><th>Źródło</th><th class="r">Wiersz</th><th>Kolumna</th><th>Opis</th></tr></thead><tbody>${issues.map(i=>`<tr><td>${pill(i[0], i[0]==='crit'?'Blokujący':'Ostrzeżenie')}</td><td>${i[1]}</td><td class="r">${i[2]}</td><td class="mono">${i[3]}</td><td>${esc(i[4])}</td></tr>`).join('')}</tbody></table></div>`;
    if(st==='error') return `<div class="note crit">1 błąd blokujący. Nowa wersja słownika „Struktura projektowa” została odrzucona, obowiązuje v${r.pinned['F16:struktura']}. Raport błędów zapisano obok pliku: <span class="mono">Slowniki\\F16_Struktura_projektowa.walidacja.xlsx</span></div>${tbl}
      <div class="row">${actBtn(r,'valFix','Plik poprawiony – waliduj ponownie')}${actBtn(r,'valKeep','Kontynuuj na v'+r.pinned['F16:struktura'],false)}</div>`;
    return `<div class="note ok">Brak błędów blokujących. ${issues.length} ostrzeżeń – przebieg może iść dalej, ostrzeżenia trafiają do raportu.${r.flags.valFixed&&f16?' Utworzono wersję v'+r.pinned['F16:struktura']+' słownika „Struktura projektowa” i przypięto ją do przebiegu.':''}</div>${tbl}`;
  },
  join(r,st,z){
    const rej = r.fin?.state==='rejected' ? `<div class="note crit">Finanse odrzuciły pliki (${esc(r.fin.by)}, ${esc(r.fin.at)}): „${esc(r.fin.comment)}”. Popraw dane i połącz ponownie.</div>` : '';
    if(st==='ready') return rej+`<p>Logika łączenia działa w bazie (procedury), więc wynik nie zależy od wersji aplikacji na komputerze.</p><div class="row">${actBtn(r,'doJoin','Połącz źródła')}</div>`;
    const ac=seedN(r,'ac',8200,14600)*1000;
    return rej+`<div class="grid g3">

/* ---------- render ---------- */
function render(){
  renderNav();
  const v=S.view; let html='';
  if(v.name==='pulpit') html=vPulpit();
  else if(v.name==='zakresy') html=vZakresy();
  else if(v.name==='zakres') html=vZakres(v.id);
  else if(v.name==='wizard') html=vWizard();
  else if(v.name==='run') html=vRun(v.id);
  else if(v.name==='przebiegi') html=vPrzebiegi();
  else if(v.name==='slowniki') html=vSlowniki();
  else html=vInfo();
  $('#main').innerHTML=html;
  $('#overlay').innerHTML = S.modal? vNewRun() : '';
  $('#role').value=S.role;
}

/* ---------- akcje ---------- */
const R=()=>S.runs[S.view.id];
const A={
  nav:x=>go({name:x}),
  zakres:x=>{ S.wiz=null; go({name:'zakres', id:x}); },
  run:x=>{ S.takeover=false; go({name:'run', id:x}); },
  wizard:()=>{ S.wiz=newWiz(); go({name:'wizard'}); },
  reset:()=>{ try{localStorage.removeItem(KEY);}catch(e){} S=seed(); render(); toast('Przywrócono dane początkowe demo.'); },
  dopen:x=>{ S.view={...S.view, open:S.view.open===x?null:x}; render(); },
  sel:x=>{ R().sel=x; S.takeover=false; save(); render(); },
  wset:(x,el)=>{ S.wiz[el.dataset.f]=x; render(); },
  wnext:()=>{ S.wiz.step++; render(); },
  wback:()=>{ S.wiz.step--; render(); },
  wcreate:()=>{
    const w=S.wiz; w.busy=true;
    const steps=['Zarejestrowano zakres w bazie (meta.Zakres) i szablon etapów','Utworzono foldery w '+ROOT+'\\Zakresy\\'+w.code,'Skopiowano wzorce słowników z nagłówkami i instrukcją','Przygotowano treść zgłoszenia do IT (uprawnienia grup AD)','Sprawdzono strukturę folderów'];
    w.progress=[]; render();
    steps.forEach((t,i)=>setTimeout(()=>{ w.progress.push({t,done:true}); if(i===steps.length-1){ w.busy=false; finishCreate(); } render(); }, 450*(i+1)));
  },
  fillDicts:x=>{
    const z=S.zakresy[x];
    for(const d of z.dicts){ const dd=S.dicts[x+':'+d]; if(!dd.versions.length) dd.versions.unshift(v(1,'29.09.2026',ME.split(' ')[0][0]+'. '+ME.split(' ')[1], d==='struktura'?96:d==='harmonogram'?38:d==='etc'?38:12,'+'+(d==='struktura'?96:38)+' / ~0 / zamk. 0','publikacja')); }
    z.cams=[['T. Sikora',7],['W. Mróz',5]];
    S.events.unshift({t:now(),who:ME,z:z.code,msg:'Opublikowano pierwsze wersje słowników zakresu (v1) – walidacja bez błędów'});
    save(); render(); toast('Słowniki zakresu mają wersję v1. Można uruchomić przebieg.');
  },
  newrun:x=>{ S.modal={zid:x, kind:'weekly'}; render(); },
  mkind:x=>{ S.modal.kind=x; render(); },
  closeModal:()=>{ S.modal=null; render(); },
  startRun:()=>{
    const m=S.modal, r=mkRun(S,m.zid,m.kind,'2026-09',m.kind==='weekly'?40:null,ME,{at:'29.09.2026'});
    r.log=[]; logRun(r,'Rozpoczęto przebieg. Przypięto wersje słowników: '+Object.entries(r.pinned).map(([d,pv])=>S.dicts[d].name+' v'+pv).join(', ')+'.');
    S.modal=null; go({name:'run', id:r.id}); toast('Przebieg '+r.id+' uruchomiony.');
  },
  takeover:()=>{ S.takeover=true; render(); },
  takeoverNo:()=>{ S.takeover=false; render(); },
  takeoverYes:()=>{ const r=R(), prev=r.owner; r.owner=ME; S.takeover=false; logRun(r,'Przejęto przebieg od: '+prev+'.'); save(); render(); toast('Prowadzisz teraz ten przebieg.'); },
  ackNewer:()=>{ const r=R(); for(const n of newerFor(r)){ r.ack[n.id+':'+n.cv]=true; logRun(r,'Decyzja: kontynuacja na '+S.dicts[n.id].name+' v'+n.pv+' mimo dostępnej v'+n.cv+'.'); } save(); render(); },
  rebase:()=>{ const r=R(); for(const n of newerFor(r)){ r.pinned[n.id]=n.cv; logRun(r,'Przypięto '+S.dicts[n.id].name+' v'+n.cv+'. Etapy od walidacji unieważnione.'); } invalidateFrom(r,'val'); save(); render(); },
  publish:x=>{
    const d=S.dicts[x];
    if(x==='stawki'){ const nv=curVer(S,x)+1; d.versions.unshift(v(nv,'29.09.2026',ME.split(' ')[0][0]+'. '+ME.split(' ')[1],190,'+6 / ~0 / zamk. 6','publikacja')); S.events.unshift({t:now(),who:ME,z:'GLOBAL',msg:'Opublikowano Stawki wydziałów v'+nv+' (walidacja bez błędów)'}); toast('Opublikowano Stawki wydziałów v'+nv+'. Aktywne przebiegi dostały informację.'); }
    else toast(d.name+': plik bez zmian (ten sam hash) – nowa wersja nie powstała.');
    save(); render();
  },
  doSap:()=>{ const r=R(); work(r,'sap','Kopiowanie plików do Landing Zone i liczenie hashy…',1300,()=>{ complete(r,'sap'); logRun(r,'Zarejestrowano 4 pliki SAP w Landing Zone.'); }); },
  doDict:()=>{ const r=R(); work(r,'dict','Import słowników zakresu do STG…',1000,()=>{ complete(r,'dict'); logRun(r, r.zid==='F16'?'Import słowników: wykryto zmianę w „Struktura projektowa” (kandydat nowej wersji).':'Import słowników: brak zmian.'); }); },
  doVal:()=>{ const r=R(); work(r,'val','Walidacja plików SAP i słowników…',1200,()=>{
    if(r.zid==='F16' && !r.flags.valFixed && !r.flags.keepOld){ setSt(r,'val','error'); logRun(r,'Walidacja: 1 błąd blokujący w „Struktura projektowa” (wiersz 214). Kandydat odrzucony.'); }
    else { complete(r,'val'); r.sel='val'; logRun(r,'Walidacja bez błędów blokujących.'); } }); },
  valFix:()=>{ const r=R(); r.flags.valFixed=true; work(r,'val','Ponowny import i walidacja poprawionego pliku…',1200,()=>{
    const d=S.dicts['F16:struktura'], nv=curVer(S,'F16:struktura')+1; d.versions.unshift(v(nv,'29.09.2026','A. Wiśniewska',413,'+1 / ~2 / zamk. 1',r.id)); r.pinned['F16:struktura']=nv;
    complete(r,'val'); r.sel='val'; logRun(r,'Walidacja bez błędów blokujących. Utworzono i przypięto „Struktura projektowa” v'+nv+'.'); }); },
  valKeep:()=>{ const r=R(); r.flags.keepOld=true; complete(r,'val'); r.sel='val'; logRun(r,'Decyzja: kontynuacja na „Struktura projektowa” v'+r.pinned['F16:struktura']+'. Kandydat odrzucony.'); save(); render(); },
  doJoin:()=>{ const r=R(); work(r,'join','Łączenie źródeł w bazie (procedury)…',1400,()=>{ complete(r,'join'); logRun(r,'Połączono źródła. 3 WBS bez mapowania (ostrzeżenie).'); }); },
  doFin:()=>{ const r=R(); work(r,'fin','Generowanie plików dla finansów…',1000,()=>{ setSt(r,'fin','action'); r.fin={state:'pending'}; logRun(r,'Wygenerowano pliki dla finansów – oczekują na zatwierdzenie.'); }); },
  finOk:()=>{ const r=R(); r.fin={state:'approved', by:'Tomasz Mazur (rola Finanse – demo)', at:now()}; complete(r,'fin'); logRun(r,'Finanse zatwierdziły pliki pośrednie.','Tomasz Mazur'); save(); render(); toast('Zatwierdzono. Kolejne etapy odblokowane.'); },
  finNo:()=>{ const r=R(), c=($('#fin-c')?.value||'').trim(); if(!c){ toast('Wpisz komentarz – bez niego analityk nie wie, co poprawić.'); $('#fin-c')?.focus(); return; }
    r.fin={state:'rejected', by:'Tomasz Mazur', at:now(), comment:c}; invalidateFrom(r,'join'); logRun(r,'Finanse odrzuciły pliki: „'+c+'”. Powrót do łączenia źródeł.','Tomasz Mazur'); save(); render(); },
  doProd:()=>{ const r=R(); work(r,'prod','Pobieranie zaawansowania z raportu produkcyjnego…',1100,()=>{ complete(r,'prod'); logRun(r,'Pobrano zaawansowanie z produkcji. Braki do uzupełnienia.'); }); },
  doFill:()=>{ const r=R(); complete(r,'fill'); logRun(r,'Uzupełniono brakujące WP (pochodzenie: ANALITYK).'); save(); render(); },
  doCamOut:()=>{ const r=R(); work(r,'camout','Generowanie plików dla CAM…',1100,()=>{ complete(r,'camout'); setSt(r,'camin','action'); logRun(r,'Wygenerowano '+S.zakresy[r.zid].cams.length+' plików dla CAM.'); }); },
  camScan:()=>{ const r=R(), z=S.zakresy[r.zid]; r.cams=z.cams.map((c,i)=>({n:c[0],wp:c[1],s: i===z.cams.length-1?'sent': i===1?'rej':'ok', msg: i===1?'Zmieniona komórka poza polami do uzupełnienia (arkusz WP, D17)': i===z.cams.length-1?'Brak pliku w Zwrócone':''}));
    setSt(r,'camin','action'); logRun(r,'Skan Zwrócone: zaimportowano '+r.cams.filter(c=>c.s==='ok').length+', odrzucono 1, brak 1.'); save(); render(); },
  camRescan:()=>{ const r=R(); r.cams.forEach(c=>{c.s='ok'; c.msg=c.msg?'Poprawiony plik zaimportowany':'';}); complete(r,'camin'); logRun(r,'Zaimportowano pliki wszystkich CAM.'); save(); render(); },
  doCamVal:()=>{ const r=R(); work(r,'camval','Walidacja zaawansowania i pochodzenia wartości…',1000,()=>{ complete(r,'camval'); logRun(r,'Walidacja zaawansowania zakończona (2 ostrzeżenia).'); }); },
  doEv:()=>{ const r=R(); work(r,'ev','Kalkulacja EV w bazie…',1400,()=>{ r.rev=(r.rev||0)+1; complete(r,'ev'); r.sel='ev'; logRun(r,'Wygenerowano EV, rewizja R'+r.rev+'.'); }); },
  doEvAgain:()=>{ const r=R(); invalidateFrom(r,'ev'); logRun(r,'Ponowne przeliczenie EV – powstanie nowa rewizja.'); save(); render(); },
  doCobra:()=>{ const r=R(); work(r,'cobra','Generowanie pliku dla Cobra…',900,()=>{ complete(r,'cobra'); r.sel='cobra'; logRun(r,'Wygenerowano plik dla Cobra.'); }); },
  freeze:()=>{ const r=R(); r.frozen=true; r.sel='ev'; logRun(r,'Zatwierdzono zamknięcie okresu '+r.period+'. Przebieg zamrożony.','Tomasz Mazur'); save(); render(); },
};
function finishCreate(){
  const w=S.wiz, id=w.code.toUpperCase();
  const dl=['struktura','harmonogram'].concat(w.type==='CAS'?['stawkicas']:[]).concat(w.etc?['etc']:[]);
  S.zakresy[id]={id, code:w.code, name:w.name, type:w.type, pool:w.pool, projects:w.projects.map(p=>[p,(AVAIL_PROJ.find(a=>a[0]===p)||[])[1]||'']), cams:[], analysts:[ME], approver:'— (brak w słowniku przypisań)', dicts:dl, created:'29.09.2026 · A. Wiśniewska', isNew:true};
  for(const d of dl) S.dicts[id+':'+d]={id:id+':'+d, name:S.zd[d], scope:id, owner:'Analityk zakresu', file:'Zakresy\\'+w.code+'\\Slowniki\\'+w.code+'_'+S.zfile[d], versions:[]};
  S.events.unshift({t:now(),who:ME,z:w.code,msg:'Utworzono zakres '+w.code+' ('+TYPES[w.type].label+')'});
  save();
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]'); if(!el) return;
  if(el.dataset.a==='closeModal' && e.target.closest('[data-stop]') && !e.target.closest('button[data-a="closeModal"]')) return;
  if(el.tagName==='A') e.preventDefault();
  const f=A[el.dataset.a]; if(f && !el.disabled) f(el.dataset.x, el);
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.w){ S.wiz[t.dataset.w]=t.value; }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='role'){ S.role=t.value; save(); render(); toast(t.value==='finanse'?'Rola: Finanse – możesz zatwierdzać pliki i zamknięcie okresu.':'Rola: Analityk.'); }
  if(t.dataset.wc){ S.wiz[t.dataset.wc]=t.checked; render(); }
  if(t.dataset.wp){ const p=t.dataset.wp, w=S.wiz; w.projects = t.checked? [...new Set([...w.projects,p])] : w.projects.filter(x=>x!==p); }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && S.modal){ S.modal=null; render(); } });
// Przebiegi zostawione w stanie "W toku" (np. po odświeżeniu strony) wracają do "Do wykonania".
for(const r of Object.values(S.runs)) for(const k in r.st) if(r.st[k].s==='running') r.st[k].s='ready';
render();
</script>
</body></html>
