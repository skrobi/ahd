<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>PZL-EV Pipeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Układ: narzędzie operacyjne – pasek środowiska u góry, nawigacja po lewej, obszar roboczy; przebieg = oś etapów + panel etapu + dziennik */
:root{
  --bg:#eef2f3; --surface:#ffffff; --surface-2:#e4eaec; --ink:#13212a; --muted:#566974; --line:#cfd9dd;
  --accent:#0a6a76; --accent-ink:#ffffff; --accent-soft:#d5ecee;
  --ok:#1d7648; --ok-soft:#dcefe4; --warn:#9a5c05; --warn-soft:#f6e8cf; --crit:#b0271f; --crit-soft:#f7dcd9;
  --info:#2c5a98; --info-soft:#dde7f5; --stale:#6c618f; --stale-soft:#e7e3f2;
  --shadow:0 1px 2px rgba(19,33,42,.06),0 4px 16px rgba(19,33,42,.06);
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-head:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1418; --surface:#141e24; --surface-2:#1b272e; --ink:#e1e9ec; --muted:#8fa2ab; --line:#29373f;
  --accent:#43b2bf; --accent-ink:#06181b; --accent-soft:#16333a;
  --ok:#55c08a; --ok-soft:#15301f; --warn:#e2a54a; --warn-soft:#352711; --crit:#f07a70; --crit-soft:#3a1a18;
  --info:#86aee8; --info-soft:#18263a; --stale:#aea3d6; --stale-soft:#262238;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0d1418; --surface:#141e24; --surface-2:#1b272e; --ink:#e1e9ec; --muted:#8fa2ab; --line:#29373f;
  --accent:#43b2bf; --accent-ink:#06181b; --accent-soft:#16333a;
  --ok:#55c08a; --ok-soft:#15301f; --warn:#e2a54a; --warn-soft:#352711; --crit:#f07a70; --crit-soft:#3a1a18;
  --info:#86aee8; --info-soft:#18263a; --stale:#aea3d6; --stale-soft:#262238;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark;}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
h1,h2,h3{font-family:var(--f-head);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.005em}
h1{font-size:1.6rem;line-height:1.2} h2{font-size:1.2rem} h3{font-size:1rem}
p{margin:0}
.mono{font-family:var(--f-mono);font-size:.86em}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Shell */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-family:var(--f-head);font-size:1.25rem;letter-spacing:.06em}
.brand span{color:var(--muted);font-size:.85rem}
.env{font-family:var(--f-mono);font-size:.75rem;padding:2px 8px;border-radius:4px;background:var(--warn-soft);color:var(--warn);font-weight:500;letter-spacing:.04em}
.who{display:flex;align-items:center;gap:8px;font-size:.85rem}
.who select{font:inherit;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:3px 6px;color:var(--ink)}
.shell{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:calc(100% - 52px)}
.nav{border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:2px;background:var(--surface)}
.nav button{all:unset;cursor:pointer;padding:8px 12px;border-radius:6px;display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);font-weight:500}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="true"]{background:var(--accent-soft);color:var(--ink)}
.nav button:focus-visible{outline:2px solid var(--accent)}
.nav .sep{height:1px;background:var(--line);margin:10px 4px}
.nav .foot{margin-top:auto;font-size:.75rem;color:var(--muted);padding:8px 12px;display:grid;gap:4px}
.count{font-family:var(--f-mono);font-size:.72rem;background:var(--surface-2);border-radius:10px;padding:0 7px;color:var(--muted)}
main{padding-block:24px 48px;padding-inline:clamp(16px,3vw,32px);min-width:0;display:flex;flex-direction:column;gap:20px}

/* Blocks */
.head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 20px;justify-content:space-between}
.head .sub{color:var(--muted);margin-top:4px}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel.flat{background:transparent;border-style:dashed}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:8px}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 14px;font-size:.9rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}

.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;min-height:36px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.small{padding:3px 10px;min-height:28px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.nodot::before{display:none}
.s-ok{background:var(--ok-soft);color:var(--ok)} .s-warn,.s-action{background:var(--warn-soft);color:var(--warn)}
.s-crit,.s-error{background:var(--crit-soft);color:var(--crit)} .s-info,.s-running{background:var(--info-soft);color:var(--info)}
.s-stale{background:var(--stale-soft);color:var(--stale)} .s-ready{background:var(--accent-soft);color:var(--accent)}
.s-done{background:var(--ok-soft);color:var(--ok)} .s-todo{background:var(--surface-2);color:var(--muted)}
.tag{font-family:var(--f-mono);font-size:.72rem;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:left;background:var(--surface-2)}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}

.note{border-left:3px solid var(--line);padding:8px 12px;background:var(--surface-2);border-radius:0 6px 6px 0;font-size:.9rem}
.note.warn{border-color:var(--warn);background:var(--warn-soft)}
.note.crit{border-color:var(--crit);background:var(--crit-soft)}
.note.ok{border-color:var(--ok);background:var(--ok-soft)}
.note.info{border-color:var(--info);background:var(--info-soft)}
.note.stale{border-color:var(--stale);background:var(--stale-soft)}

.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.checks li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;align-items:start}
.ic{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:.7rem;font-weight:700;margin-top:2px}
.ic.ok{background:var(--ok-soft);color:var(--ok)} .ic.warn{background:var(--warn-soft);color:var(--warn)} .ic.crit{background:var(--crit-soft);color:var(--crit)} .ic.todo{background:var(--surface-2);color:var(--muted)}

.tree{font-family:var(--f-mono);font-size:.8rem;line-height:1.7;white-space:pre;overflow-x:auto;background:var(--surface-2);border-radius:6px;padding:12px 14px;margin:0}

/* karty (przebieg) */
.zcard{cursor:pointer;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.zcard:hover{border-color:var(--accent)}
.zcard .code{font-family:var(--f-head);font-size:1.35rem;font-weight:600}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dot{width:18px;height:6px;border-radius:3px;background:var(--surface-2)}
.dot.done{background:var(--ok)} .dot.action,.dot.ready{background:var(--warn)} .dot.error{background:var(--crit)} .dot.running{background:var(--info)} .dot.stale{background:var(--stale)}

/* Run view */
.run-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.stepper{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.step{all:unset;cursor:pointer;flex:1 0 118px;border:1px solid var(--line);border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;background:var(--surface);min-width:118px}
.step:focus-visible{outline:2px solid var(--accent)}
.step .n{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.step .t{font-weight:600;font-size:.84rem;line-height:1.25}
.step .bar{height:4px;border-radius:2px;background:var(--surface-2)}
.step[aria-current="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.step.done .bar{background:var(--ok)} .step.action .bar,.step.ready .bar{background:var(--warn)} .step.error .bar{background:var(--crit)}
.step.running .bar{background:var(--info)} .step.stale .bar{background:var(--stale)}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;font-size:.84rem;max-height:560px;overflow:auto}
.log li{display:grid;gap:2px;border-left:2px solid var(--line);padding-left:10px}
.log .t{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.progress{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.progress i{display:block;height:100%;width:40%;background:var(--info);border-radius:3px;animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
@media (prefers-reduced-motion: reduce){.progress i{animation:none;width:100%;opacity:.6}}
.prov{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--surface-2)}
.prov span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.82rem}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* Forms / wizard */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-weight:600;font-size:.85rem}
.field .hint{font-size:.8rem;color:var(--muted)}
input[type=text],textarea,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;width:100%}
textarea{min-height:70px;resize:vertical}
.choice{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
.opt{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;background:var(--surface)}
.opt:focus-visible{outline:2px solid var(--accent)}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.opt b{font-family:var(--f-head);font-size:1rem}
.opt span{font-size:.82rem;color:var(--muted)}
.wsteps{display:flex;gap:4px;flex-wrap:wrap;list-style:none;padding:0;margin:0}
.wsteps li{font-size:.8rem;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.wsteps li.on{background:var(--accent);color:var(--accent-ink)}
.wsteps li.past{background:var(--accent-soft);color:var(--ink)}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:6px}
.chk input{margin-top:4px}
.chk.dis{opacity:.55}

/* Overlay */
.overlay{position:fixed;inset:0;background:rgba(10,20,25,.45);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:10px;border:1px solid var(--line);box-shadow:var(--shadow);width:min(640px,100%);max-height:90vh;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:16px}
.toast{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;box-shadow:var(--shadow);z-index:60;max-width:min(420px,calc(100% - 32px))}
.banner{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:8px;border:1px solid var(--stale);background:var(--stale-soft)}
.banner.lock{border-color:var(--info);background:var(--info-soft)}

@media (max-width:900px){
  .run-layout{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:760px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px 16px}
  .nav .sep,.nav .foot{display:none}
  .nav button{white-space:nowrap}
  .nav .grp,.nav .sub{display:none}
  .tabs{order:3;flex-basis:100%}
  .brand span{display:none}
}
/* Drzewa CES | P1S, edytor słowników */
.trees{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:16px}
.mt{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px;font-size:.86rem}
.mt.scroll{max-height:520px;overflow:auto}
.trow{display:flex;align-items:flex-start;gap:2px;min-width:0}
.nd{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:4px 8px;align-items:center;flex-wrap:wrap;flex:1;min-width:0;padding:5px 8px;border-radius:5px}
.nd:hover{background:var(--surface-2)}
.nd[aria-pressed="true"]{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.nd:focus-visible,.tg:focus-visible{outline:2px solid var(--accent)}
.nd .c{font-family:var(--f-mono);font-size:.8rem}
.nd .x{color:var(--muted);font-size:.78rem}
.nd .amt{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted);font-size:.8rem}
.tg{all:unset;cursor:pointer;width:22px;min-height:28px;display:grid;place-items:center;color:var(--muted);font-family:var(--f-mono);flex:none}
.tg.blank{cursor:default}
.selbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:5;box-shadow:var(--shadow)}
.selbar .slot{display:inline-flex;gap:6px;align-items:center;padding:3px 10px;border:1px dashed var(--line);border-radius:6px;font-family:var(--f-mono);font-size:.82rem;min-height:30px}
.selbar .slot.on{border-style:solid;border-color:var(--accent);background:var(--accent-soft)}
tr.closed td{color:var(--muted)}
tr.closed td.k{text-decoration:line-through}
.form-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr))}
.form-grid input,.form-grid select{min-height:36px}
.inline{display:inline-flex;gap:6px;align-items:center;font-size:.88rem}
.nav .grp{font-size:.7rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600;padding:2px 12px 4px}
.run-layout.full{grid-template-columns:minmax(0,1fr)}
.dnd{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:16px;align-items:start}
.dnd .panel{padding:14px;gap:10px}
.grip{color:var(--muted);font-size:.7rem;letter-spacing:-2px;cursor:grab}
.nd[draggable="true"]{cursor:grab;-webkit-user-drag:element;user-select:none}
.lk{font-family:var(--f-mono);font-size:.74rem;padding:1px 6px;border-radius:4px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.nd.linked{box-shadow:inset 3px 0 0 var(--accent)}
.nd.hl{background:var(--warn-soft);box-shadow:inset 0 0 0 2px var(--warn)}
body.dragging [data-drop]{outline:1px dashed var(--line)}
[data-drop].over{background:var(--ok-soft);outline:2px solid var(--ok)}
[data-drop].over.bad{background:var(--crit-soft);outline:2px solid var(--crit)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:4px 10px;font-size:.8rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button:focus-visible{outline:2px solid var(--accent)}
details.cat{border-top:1px solid var(--line);padding-top:10px}
details.cat>summary{cursor:pointer;font-weight:600;margin-bottom:10px}
details.cat .mt{max-height:420px;overflow:auto}
.x-btn{all:unset;cursor:pointer;margin-left:4px;color:var(--crit);font-weight:700}
/* sekcje główne */
.tabs{display:flex;gap:4px;margin-right:auto}
.tabs button{all:unset;cursor:pointer;padding:6px 14px;border-radius:6px;font-weight:600;color:var(--muted)}
.tabs button:hover{background:var(--surface-2);color:var(--ink)}
.tabs button[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
.tabs button:focus-visible{outline:2px solid var(--accent)}
.shell.noside{grid-template-columns:minmax(0,1fr)} .shell.noside .nav{display:none}
.nav .sub{padding:5px 12px 5px 24px;font-size:.88rem}
.nav .add{color:var(--accent)}
.nav .pill{font-size:.68rem;padding:1px 7px}
.nav .grp.row{padding-right:6px}
.mini{all:unset;cursor:pointer;width:22px;height:22px;border-radius:4px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-weight:700}
.count.crit{background:var(--crit-soft);color:var(--crit)}
th .sort{all:unset;cursor:pointer;font:inherit;letter-spacing:inherit;text-transform:inherit}
th .sort:focus-visible{outline:2px solid var(--accent)}
.facts{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:.9rem;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:.74rem;padding:2px 8px;border-radius:4px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
details.ready summary,details.panel>summary{cursor:pointer}
details.ready .checks{margin-top:8px}
/* mapowanie */
.filters{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.filters select{width:auto}
.map3{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr) minmax(0,1.15fr);gap:14px;align-items:start}
.map3 .panel{padding:12px;gap:8px}
@media (max-width:1100px){.map3{grid-template-columns:minmax(0,1fr)}}
.dropzone{border:2px dashed var(--line);border-radius:8px;padding:12px;text-align:center;color:var(--muted);font-size:.85rem}
body.dragging .dropzone{border-color:var(--crit);color:var(--crit)}
.dropzone.over{background:var(--crit-soft)!important;outline:none!important;border-color:var(--crit)}

function nodeOf(code){
  if(P1S_NODE[code]) return P1S_NODE[code];
  const m=/^([A-Z]{2})-(\d{5})(?:\.(\d{2}))?$/.exec(code||''); if(!m || !CAT[m[1]]) return null;
  const c=CAT[m[1]], org=m[1]+'-'+m[2];

}

}

function catOf(code){
  const n=nodeOf(code); if(!n) return null;
  const c=CAT[orgInfo(n.org).px], ov=grpOverride(code);
  return {kz:c.kz, kat:c.kat, opis:c.opis, grp: ov? ov.v.name : c.opis, ov};
}

function p1sSearch(q,limit=50){ // symulacja zapytania do PZLPROD.LOG.WBS (TOP 50)
  q=q.trim().toUpperCase(); if(q.length<3) return {rows:[], more:false};
  const rows=[];
  for(const n of Object.values(P1S_NODE)) if((n.c+' '+n.n).toUpperCase().includes(q)) rows.push(n.c);
  const m=/^([A-Z]{2})-?(\d{1,5})?$/.exec(q), c=m&&CAT[m[1]];
  if(c) for(let i=1;i<=c.cnt && rows.length<=limit;i++){ const code=synthOrg(c.px,i); if(!m[2] || code.includes(m[2])) rows.push(code); }
  return {rows:rows.slice(0,limit), more:rows.length>limit};
}

function hash(str){ let h=2166136261; for(const c of str){ h^=c.charCodeAt(0); h=Math.imul(h,16777619);} return (h>>>0); }
function sha(str){ let a=hash(str), out=''; for(let i=0;i<8;i++){ a=Math.imul(a^(a>>>13),1274126177)>>>0; out+=a.toString(16).padStart(8,'0').slice(0,8);} return out; }

/* ---------- mapowanie CES ↔ P1S ---------- */
function activeRules(){ return S.map.rules.filter(isActive); }
function projRule(pd){ return activeRules().find(r=>r.kind==='proj'&&r.ces===pd); }
function wbsRule(w){ return activeRules().find(r=>r.kind==='wbs'&&r.ces===w); }
function isProj(x){ return S.ces.some(p=>p.pd===x); }
function resolve(pd, w){ const e=wbsRule(w), p=projRule(pd); if(e) return {s:p?'OVERRIDE':'MAPPED', t:e.p1s}; if(p) return {s:'INHERITED', t:p.p1s}; return {s:'UNMAPPED', t:null}; }
function allCes(){ return S.ces.flatMap(p=>p.wbs.map(w=>({...w, pd:p.pd, pname:p.name, prop:p.prop, r:resolve(p.pd,w.c)}))); }
function unmapped(){ return allCes().filter(x=>x.r.s==='UNMAPPED'); }
function scopeOfOrg(org){ return Object.values(S.zakresy).find(z=>z.p1s.includes(org)); }
function scopeCes(zid){ const z=S.zakresy[zid]; return allCes().filter(x=>x.r.t && z.p1s.includes(nodeOf(x.r.t)?.org)); }
function scopeUnm(zid){ const z=S.zakresy[zid]; return unmapped().filter(x=>x.prop && z.p1s.includes(x.prop)); }

function importedSrc(){ const m={}; for(const [n,f] of Object.entries(S.imp.imported)){ const s=srcOf(n); if(s && (!m[s] || f.at>m[s].at)) m[s]={at:f.at, name:n}; } return m; }

  for(const r of active(S.dicts.zrodla)) (by[r.v.proj] ||= []).push(r.v.src);
  return Object.entries(by).map(([proj,srcs])=>({proj, z:scopeOfOrg(proj), srcs:srcs.map(s=>({s, ok:!!imp[s], at:imp[s]?.at})), ok:srcs.every(s=>imp[s])}));

function runId(z,kind,period,week){ return 'R-'+z+'-'+period+'-'+(kind==='close'?'Z':'T'+week); }
function computeSnap(zid){

  const wps=wpsOf(zid), hasB=new Set(active(S.dicts[zid+':harm']).map(r=>r.v.wp));
  const rows={}; for(const id of relevant(z)) rows[id]=rowsOf(id);
  return {rev:S.dbRev, unm:un.map(x=>({c:x.c, pd:x.pd, n:x.n, cost:x.cost, prop:x.prop})), noWp:noWp(zid),
    missRate:(DEPTS[zid]||['W-101']).filter(d=>!hasRate(d,2026)), noBudget:wps.filter(v=>!hasB.has(v.wp)).map(v=>v.wp),
    ces:sc.length, cost:sum(sc.map(x=>x.cost)), rows};
}
function pinSnap(r){ r.pinRev=S.dbRev; r.snap=computeSnap(r.zid); r.ack={}; }
function mkRun(zid,kind,period,week,owner,opt={}){
  const z=S.zakresy[zid], defs=stageDefs(z.type,kind), id=runId(zid,kind,period,week);
  const st={}; let reached=!opt.upTo && !opt.allDone;
  defs.forEach((d,i)=>{
    if(opt.allDone) st[d.k]={s:'done'};
    else if(opt.upTo){ if(reached) st[d.k]={s:'todo'}; else if(d.k===opt.upTo){ st[d.k]={s:'action'}; reached=true; } else st[d.k]={s:'done'}; }
    else st[d.k]={s:i===0?'ready':'todo'};
  });
  const r={id, zid, kind, period, week, owner, started:opt.at||'29.09.2026', st, sel:null, log:[], ack:{}, flags:{}, fin:null, cams:null, newEl:null,
    rev:opt.allDone?1:0, frozen:!!(opt.allDone && kind==='close'), pinRev:null, snap:null, files:null};
  if(opt.allDone || opt.upTo){ pinSnap(r); r.files=pinFiles(zid); }
  if(opt.upTo==='fin') r.fin={state:'pending'};
  r.log.push({t:(opt.at||'29.09.2026').slice(0,5)+' 08:31', who:owner, msg:'Rozpoczęto przebieg.'});
  if(r.pinRev) r.log.unshift({t:(opt.at||'').slice(0,5)+' 08:40', who:owner, msg:'Przypięto stan słowników #'+r.pinRev+' i skopiowano migawkę do MS SQL.'});
  if(opt.allDone) r.log.unshift({t:(opt.at||'').slice(0,5)+' 16:05', who:owner, msg: kind==='close'?'Zatwierdzono zamknięcie okresu. Przebieg zamrożony.':'Wygenerowano EV wstępne (R1).'});
  S.runs[id]=r; return r;
}
function defsOf(r){ return stageDefs(S.zakresy[r.zid].type, r.kind); }
function runLabel(r){ return r.kind==='close' ? 'Zamknięcie '+r.period : 'Tydzień '+r.week+' · '+r.period; }
function runState(r){
  const defs=defsOf(r);
  if(defs.every(d=>r.st[d.k].s==='done')) return {s:'done', txt:r.frozen?'Zamknięty i zamrożony':'Zakończony'};

}
function activeRuns(zid){ return Object.values(S.runs).filter(r=>r.zid===zid && runState(r).s!=='done'); }
function runsOf(zid){ return Object.values(S.runs).filter(r=>r.zid===zid).sort((a,b)=>(b.period+(b.week||99)).localeCompare(a.period+(a.week||99))); }
function newerFor(r){
  if(!r.pinRev || runState(r).s==='done') return [];
  return relevant(S.zakresy[r.zid]).map(id=>({id, m:meta(id)})).filter(x=>x.m.lastRev>r.pinRev && !r.ack[x.id+':'+x.m.lastRev]);
}
function setSt(r,k,s,extra={}){ r.st[k]={...r.st[k],s,...extra}; }
function complete(r,k){ const defs=defsOf(r), i=defs.findIndex(d=>d.k===k); setSt(r,k,'done'); const nx=defs[i+1]; if(nx && ['todo','stale'].includes(r.st[nx.k].s)) setSt(r,nx.k,'ready'); if(nx) r.sel=nx.k; }
function invalidateFrom(r,k){ const defs=defsOf(r), i=defs.findIndex(d=>d.k===k); defs.forEach((d,j)=>{ if(j===i) setSt(r,d.k,'ready'); else if(j>i) setSt(r,d.k,['done','action','error','running'].includes(r.st[d.k].s)?'stale':'todo'); }); r.sel=k; }
function work(r,k,label,ms,fn){ setSt(r,k,'running',{label}); render(); setTimeout(()=>{ fn(); save(); render(); }, ms); }
const canAct = r => !r.frozen;

/* ---------- nawigacja: sekcje główne u góry (Pulpit | ADMIN | Projekty), menu kontekstowe z boku ---------- */
function sectionOf(v){
  if(v.name==='pulpit') return 'pulpit';
  if(['slowniki','import','mapa','info'].includes(v.name)) return 'admin';
  if(v.name==='dict'){ const d=S.dicts[v.id]; return d && !['global','config'].includes(d.scope) ? 'projekty' : 'admin'; }
  return 'projekty';
}
function curRun(zid){ const act=activeRuns(zid); return act.find(r=>r.week===40) || act[0] || runsOf(zid)[0] || null; }
function projState(z){
  if(!dictComplete(z)) return ['crit','słowniki'];
  const a=activeRuns(z.id)[0];
  if(a) return ['action','error'].includes(runState(a).s) ? ['warn','czeka'] : ['info','aktywny'];
  return runsOf(z.id).some(r=>r.week===40) ? ['ok','gotowy'] : ['todo','brak T40'];
}
const CUR_PERIOD='weekly:2026-09:40';
function periods(){
  const m={}, add=(kind,period,week)=>{ const key=kind+':'+period+':'+(week||''); return m[key] ||= {key,kind,period,week,label: kind==='close'?'Zamknięcie '+period:'T'+week+' '+period}; };
  add('weekly','2026-09',40);
  for(const r of Object.values(S.runs)) add(r.kind,r.period,r.week);
  return Object.values(m).sort((a,b)=>(b.period+(b.week||99)).localeCompare(a.period+(a.week||99)));
}

/* ---------- PULPIT: tabela projektów + krótka lista „Wymaga uwagi” ---------- */
function attention(){
  const att=[];
  const inc=completeness().filter(c=>!c.ok);
  if(inc.length) att.push({lvl:'warn', tag:'RABIT', txt:'Niekompletne źródła: '+inc.map(c=>c.proj+' (brak '+c.srcs.filter(s=>!s.ok).map(s=>s.s).join(', ')+')').join('; '), a:'nav', x:'import'});
  const orphan=unmapped().filter(x=>!x.prop || !scopeOfOrg(x.prop));
  if(orphan.length) att.push({lvl:'crit', tag:'MAPOWANIE', txt:`${orphan.length} WBS CES bez mapowania i bez projektu, koszt ${nf(sum(orphan.map(x=>x.cost)))} PLN`, a:'goMapZ', x:'none'});
  for(const z of Object.values(S.zakresy)){
    const su=scopeUnm(z.id);
    if(su.length) att.push({lvl:'crit', tag:z.code, txt:`${su.length} WBS UNMAPPED, koszt ${nf(sum(su.map(x=>x.cost)))} PLN`, a:'goMapZ', x:z.id});
    const miss=(DEPTS[z.id]||[]).filter(d=>!hasRate(d,2026));
    if(miss.length) att.push({lvl:'crit', tag:z.code, txt:'Brak stawki '+miss.join(', ')+' na 2026', a:'dict', x:'stawki'});
    if(!dictComplete(z)) att.push({lvl:'crit', tag:z.code, txt:'Słowniki projektu niekompletne – przebieg zablokowany', a:'zakres', x:z.id});
    for(const r of activeRuns(z.id)){ const rs=runState(r);
      if(r.fin?.state==='pending' && r.st.fin?.s==='action') att.push({lvl:'info', tag:z.code, txt:runLabel(r)+': pliki dla finansów czekają na zatwierdzenie', a:'run', x:r.id});
      else if(['action','error'].includes(rs.s)) att.push({lvl:rs.s==='error'?'crit':'warn', tag:z.code, txt:runLabel(r)+': '+rs.txt, a:'run', x:r.id});
      if(newerFor(r).length) att.push({lvl:'stale', tag:z.code, txt:runLabel(r)+': słowniki zmienione po przypięciu', a:'run', x:r.id});
    }
  }
  const ord={crit:0,warn:1,stale:2,info:3}; return att.sort((a,b)=>ord[a.lvl]-ord[b.lvl]);
}

function readiness(z){
  const items=[], missing=dictIdsOf(z).filter(id=>!active(S.dicts[id]).length);

  for(const id of dictIdsOf(z)) items.push(active(S.dicts[id]).length? {ok:true, txt:dname(id)+': wypełniony'} : {ok:false, lvl:'crit', txt:dname(id)+': pusty'});

  items.push(cams.length? {ok:true, txt:'WP mają CAM: '+cams.length+' osób'} : {ok:false, lvl:'warn', txt:'Brak WP z CAM – pliki CAM nie powstaną'});
  const inc=completeness().filter(c=>z.p1s.includes(c.proj) && !c.ok);
  items.push(inc.length? {ok:false, lvl:'warn', txt:'Niekompletne źródła RABIT: '+inc.map(c=>c.proj).join(', ')} : {ok:true, txt:'Źródła RABIT kompletne'});

}

/* ---------- ADMIN → Mapowanie CES ↔ P1S ----------
   Zasada: każda zmiana przechodzi przez PODGLĄD (rodzaj reguły + skutek dla każdego WBS) i dopiero „Zapisz” ją utrwala.
   Źródła zmiany: przeciągnięcie CES → P1S, klik CES potem klik P1S, przeciągnięcie na „Bez mapowania” (usunięcie),
   przyjęcie propozycji, formularz ręczny. */
function zOfCes(x){ const org = x.r.t ? nodeOf(x.r.t)?.org : x.prop; return (org && scopeOfOrg(org)?.id) || 'none'; }
function cesName(code){ const p=S.ces.find(p=>p.pd===code); if(p) return p.name; for(const p of S.ces){ const w=p.wbs.find(w=>w.c===code); if(w) return w.n+' · '+p.pd; } return ''; }
function cesView(){
  const mp=S.mp, q=mp.q.trim().toLowerCase();
  const items=allCes().filter(x=>(mp.z==='all'||zOfCes(x)===mp.z) && (!q || (x.c+' '+x.n+' '+x.pd+' '+x.pname).toLowerCase().includes(q)));
  const counts={}; for(const x of items) counts[x.r.s]=(counts[x.r.s]||0)+1;
  const groups=[], gi={};
  for(const x of items.filter(x=>mp.f==='all'||x.r.s===mp.f)){ if(!gi[x.pd]){ gi[x.pd]={p:S.ces.find(c=>c.pd===x.pd), items:[]}; groups.push(gi[x.pd]); } gi[x.pd].items.push(x); }
  return {items, counts, groups};
}
function linksTo(code){
  return activeRules().filter(r=>r.p1s===code).map(r=> r.kind==='proj'
    ? {r, txt:`${r.ces} · reguła · ${S.ces.find(p=>p.pd===r.ces)?.wbs.filter(w=>resolve(r.ces,w.c).s==='INHERITED').length||0} WBS`}
    : {r, txt:`${r.ces} · wyjątek`});
}
function orgCost(org){ const xs=allCes().filter(x=>x.r.t && nodeOf(x.r.t)?.org===org); return {n:xs.length, cost:sum(xs.map(x=>x.cost))}; }
function selTarget(){ const sc=S.mp.selCes; if(!sc) return null; if(isProj(sc)) return projRule(sc)?.p1s||null; const p=S.ces.find(p=>p.wbs.some(w=>w.c===sc)); return p? resolve(p.pd,sc).t : null; }
function p1sRow(n,org,pad){
  const code=n[0], lv=n[2], mp=S.mp, links=linksTo(code), tgt=selTarget(), hl = tgt===code || mp.pend?.target===code;
  const zz=lv===1? scopeOfOrg(org) : null, oc=lv===1? orgCost(org) : null;
  return `<button class="nd ${hl?'hl':''} ${links.length?'linked':''}" data-drop="${code}" data-a="mp1s" data-x="${code}" aria-pressed="${mp.selP1s===code}" style="padding-left:${pad}px">
    <span class="c">${lv===1?'<b>'+code+'</b>':code}</span><span>${esc(n[1])}</span>
    ${lv===1?(zz?`<span class="tag">${esc(zz.code)}</span>`:'<span class="x">bez projektu</span>'):''}${n[3]?`<span class="x">zaawans. ${n[3]}%</span>`:''}
    ${links.map(l=>`<span class="lk">← ${esc(l.txt)}</span>`).join('')}${oc&&oc.n?`<span class="amt">${oc.n} WBS · ${nf(oc.cost)} PLN</span>`:''}</button>`;
}
function p1sOrg(org,forceOpen){
  const o=orgInfo(org); if(!o) return '';
  const mp=S.mp, tOrg=nodeOf(selTarget()||'')?.org, pOrg=nodeOf(mp.pend?.target||'')?.org;
  const open=forceOpen || mp.open['p:'+org] || tOrg===org || pOrg===org;
  return `<li><div class="trow"><button class="tg" data-a="mtog" data-x="p:${org}" aria-label="${open?'Zwiń':'Rozwiń'} ${org}">${open?'▾':'▸'}</button>${p1sRow(o.nodes[0],org,8)}</div>
    ${open?`<ul class="mt">${o.nodes.slice(1).map(n=>`<li><div class="trow"><span class="tg blank"></span>${p1sRow(n,org,8+(n[2]-1)*18)}</div></li>`).join('')}</ul>`:''}</li>`;
}
function p1sCatalog(pick,noInput){ // pick: wybór PROJORG w kreatorze (checkboxy) zamiast celów mapowania
  const mp=S.mp, q=mp.pq.trim(), orgLine = org => pick ? pickRow(org) : p1sOrg(org,false);
  let body;
  if(q.length>=3){
    const {rows,more}=p1sSearch(q), orgs=[...new Set(rows.map(c=>nodeOf(c).org))];
    body = orgs.length? `<p class="muted small">Wyniki dla „${esc(q)}”: ${rows.length}${more?'+ – pokazano pierwsze 50, zawęź wyszukiwanie':''}</p><ul class="mt">${orgs.map(orgLine).join('')}</ul>` : `<p class="muted">Brak wyników dla „${esc(q)}”.</p>`;

    const agg=(rows,key)=>{ const m=new Map(); for(const r of rows){ const k=key(r); m.set(k,(m.get(k)||0)+r[4]); } return [...m]; };
    const tbl=(head,rows)=>`<div class="tbl-wrap"><table><thead><tr><th>${head}</th><th class="r">PROJORG</th></tr></thead><tbody>${rows}</tbody></table></div>`;

      crumb.push(`<b>${esc(c.opis)}</b>`);
      body = `<div class="row between"><span class="small">${crumb.join(' › ')}</span>
        <span class="row"><button class="btn small" data-a="ppage" data-x="-1" ${pg?'':'disabled'} aria-label="Poprzednia strona">‹</button><span class="small num">${nf(pg*25+1)}–${nf(Math.min((pg+1)*25,c.cnt))} z ${nf(c.cnt)}</span><button class="btn small" data-a="ppage" data-x="1" ${pg<pages-1?'':'disabled'} aria-label="Następna strona">›</button></span></div>

    } else if(kat){

    } else if(kz){

    } else {

function p1sInput(){ return `<input type="text" id="pq" data-pq value="${esc(S.mp.pq)}" placeholder="Szukaj w P1S: kod lub opis (min. 3 znaki)" aria-label="Szukaj w P1S">`; }
function pendInfo(p){
  const isPd=p.src.startsWith('pd:'), code=p.src.slice(p.src.indexOf(':')+1);
  const pdObj = isPd ? S.ces.find(x=>x.pd===code) : S.ces.find(x=>x.wbs.some(w=>w.c===code));
  const wl = isPd ? pdObj.wbs : pdObj.wbs.filter(w=>w.c===code), pr=projRule(pdObj.pd);
  const I={code, isPd, kind:'', save:'Zapisz', errs:[], warns:[], info:[], eff:[], fix:null};
  const E=(w,a)=>({c:w.c, n:w.n, cost:w.cost, b:resolve(pdObj.pd,w.c), a});
  if(p.op==='assign'){
    const n=nodeOf(p.target);
    if(isPd){
      I.kind='Reguła projektu'; I.save='Zapisz regułę';
      if(n.l!==1){ I.errs.push(`Reguła projektu wskazuje zawsze PROJORG – najwyższy poziom P1S (M7). ${n.c} jest elementem poziomu ${n.l}. Użyj ${n.org} albo przeciągnij pojedynczy WBS (wyjątek).`); I.fix=n.org; }
      else if(pr && pr.p1s===n.c) I.errs.push(`Reguła ${code} → ${n.c} już obowiązuje.`);
      if(pr && pr.p1s!==n.c && n.l===1) I.warns.push(`Zastąpi obecną regułę ${code} → ${pr.p1s}. Stara reguła zostanie zamknięta i zostaje w historii.`);
      I.eff=wl.map(w=>{ const e=wbsRule(w.c); return E(w, e? {s:'OVERRIDE', t:e.p1s} : {s:'INHERITED', t:n.l===1?n.c:n.org}); });
      I.info.push(`Obejmie obecne WBS projektu ${code} i wszystkie przyszłe – nowe WBS z importu odziedziczą regułę same.`);
    } else {
      const e=wbsRule(code);
      I.kind='Wyjątek WBS'; I.save='Zapisz wyjątek';
      if(e && e.p1s===n.c) I.errs.push(`${code} jest już przypisany do ${n.c}.`);
      else if(!e && pr && pr.p1s===n.c) I.errs.push(`${code} już dziedziczy ${n.c} z reguły projektu ${pdObj.pd} – wyjątek nie jest potrzebny.`);
      if(e && e.p1s!==n.c) I.warns.push(`Zastąpi obecny wyjątek ${code} → ${e.p1s}. WBS ma zawsze jeden cel – koszt liczony raz (M3).`);
      if(pr) I.info.push(`Wyjątek ma pierwszeństwo przed regułą projektu ${pdObj.pd} → ${pr.p1s}.`);
      I.eff=[E(wl[0], {s:pr?'OVERRIDE':'MAPPED', t:n.c})];
    }
    const zz=scopeOfOrg(n.org);
    if(zz) I.info.push(`Koszt trafi do projektu ${zz.code} (${zz.name}).`);
    else I.warns.push(`${n.org} nie należy do żadnego projektu – koszt nie trafi do żadnego przebiegu, dopóki PROJORG nie zostanie dodany do projektu.`);
  } else if(isPd){
    I.kind='Usunięcie reguły projektu'; I.save='Usuń regułę';
    if(!pr) I.errs.push(`${code} nie ma reguły projektu – nie ma czego usuwać.`);
    I.eff=wl.map(w=>{ const e=wbsRule(w.c); return E(w, e? {s:'MAPPED', t:e.p1s} : {s:'UNMAPPED', t:null}); });
  } else {
    const e=wbsRule(code);
    I.kind= e? 'Usunięcie wyjątku' : 'Odpięcie WBS'; I.save= e? 'Usuń wyjątek' : 'Odepnij';
    if(!e) I.errs.push(pr ? `${code} dziedziczy cel z reguły projektu ${pdObj.pd} → ${pr.p1s}. Pojedynczego WBS nie da się odpiąć (status NO_P1S odłożony – M14). Usuń regułę projektu ${pdObj.pd} albo przeciągnij WBS na inny cel (wyjątek).` : `${code} nie ma mapowania.`);
    I.eff=[E(wl[0], pr? {s:'INHERITED', t:pr.p1s} : {s:'UNMAPPED', t:null})];
  }
  return I;
}
function commitPend(){
  const p=S.mp.pend, I=pendInfo(p); if(I.errs.length) return;
  const code=I.code;
  if(p.op==='assign'){
    const ex = I.isPd ? projRule(code) : wbsRule(code); if(ex) ex.vt=YESTERDAY;
    addRule(I.isPd?'proj':'wbs', code, p.target);
    bump('map', (I.isPd?'Reguła projektu ':'Wyjątek ')+code+' → '+p.target+(ex?' (poprzednio '+ex.p1s+')':''));
  } else {
    const r = I.isPd ? projRule(code) : wbsRule(code); r.vt=YESTERDAY;
    bump('map', 'Usunięto '+(I.isPd?'regułę projektu ':'wyjątek ')+code+' → '+r.p1s);
  }
  const ch=I.eff.filter(e=>e.b.s!==e.a.s || e.b.t!==e.a.t).length;
  mmsg('ok', `${I.kind}: zapisano (stan bazy #${S.dbRev}). Zmieniony status lub cel: ${ch} WBS.`);
  // po przypisaniu od razu pokazujemy element P1S (kategoria + nazwa grupy); po usunięciu – element CES
  S.mp.pend=null; if(p.op==='assign'){ S.mp.selCes=null; S.mp.selP1s=p.target; } else { S.mp.selCes=code; S.mp.selP1s=null; }
}
function catPathHtml(k){ if(!k) return '<span class="muted">—</span>'; return `<span class="kpath">${esc(k.kz)} › ${esc(k.kat)} › ${k.ov?`<b>${esc(k.grp)}</b> <span class="muted small">(✎ zamiast ${esc(k.opis)}${k.ov.v.p1s!==undefined?' · ustawione na '+esc(k.ov.v.p1s):''})</span>`:esc(k.grp)}</span>`; }
function catChip(code){ const k=catOf(code); return k? `<span class="kt" title="${esc(k.kz+' › '+k.kat+' › '+k.grp)}">${k.ov?'✎ ':''}${esc(k.grp)}</span>` : ''; }
function grpForm(n){

/* Koszty CES pogrupowane kategorią P1S, którą element dostał przy zmapowaniu: Z_KAT_ZBIORCZA → Z_KATEGORIA → grupa (Z_OPIS albo nazwa własna) */
function catTable(items, clickable){
  const T={}, un=items.filter(x=>!x.r.t);
  for(const x of items.filter(x=>x.r.t)){ const k=catOf(x.r.t), org=nodeOf(x.r.t).org;
    const a=(T[k.kz] ||= {cost:0,n:0,kat:{}}), b=(a.kat[k.kat] ||= {cost:0,n:0,grp:{}}), c=(b.grp[k.grp] ||= {cost:0,n:0,ov:false,orgs:new Set()});
    for(const o of [a,b,c]){ o.cost+=x.cost; o.n++; } if(k.ov) c.ov=true; c.orgs.add(org); }
  const tot=sum(items.map(x=>x.cost))||1, pct=v=>`<span class="bar"><i style="width:${Math.max(2,Math.round(v/tot*100))}%"></i></span>`;
  const rows=[];
  for(const [kz,a] of Object.entries(T).sort((x,y)=>y[1].cost-x[1].cost)){
    rows.push(`<tr class="l1"><td><b>${esc(kz)}</b></td><td class="r">${a.n}</td><td class="r"><b>${nf(a.cost)}</b></td><td>${pct(a.cost)}</td><td></td></tr>`);
    for(const [kat,b] of Object.entries(a.kat).sort((x,y)=>y[1].cost-x[1].cost)){
      rows.push(`<tr class="l2"><td>${esc(kat)}</td><td class="r">${b.n}</td><td class="r">${nf(b.cost)}</td><td>${pct(b.cost)}</td><td></td></tr>`);
      for(const [g,c] of Object.entries(b.grp).sort((x,y)=>y[1].cost-x[1].cost))
        rows.push(`<tr class="l3"><td>${c.ov?'✎ <b>'+esc(g)+'</b>':esc(g)}</td><td class="r">${c.n}</td><td class="r">${nf(c.cost)}</td><td>${pct(c.cost)}</td><td class="small">${[...c.orgs].map(o=>clickable?`<a href="#" data-a="mp1sGo" data-x="${o}" class="mono">${o}</a>`:`<span class="mono">${o}</span>`).join(', ')}</td></tr>`);
    }
  }
  if(un.length) rows.push(`<tr class="l1 un"><td><b>Bez kategorii</b> <span class="muted small">(UNMAPPED)</span></td><td class="r">${un.length}</td><td class="r"><b>${nf(sum(un.map(x=>x.cost)))}</b></td><td>${pct(sum(un.map(x=>x.cost)))}</td><td class="small muted">kategoria pojawi się po zmapowaniu</td></tr>`);
  return `<div class="tbl-wrap"><table class="ktree"><thead><tr><th>Z_KAT_ZBIORCZA › Z_KATEGORIA › grupa</th><th class="r">WBS CES</th><th class="r">Koszt [PLN]</th><th style="width:18%">Udział</th><th>Elementy P1S</th></tr></thead><tbody>${rows.join('')||'<tr><td colspan="5" class="muted">Brak danych.</td></tr>'}</tbody></table></div>`;
}

function actBtn(r,a,label,primary=true,cls='',x=''){ return `<button class="btn ${primary?'primary':''} ${cls}" data-a="${a}" ${x?`data-x="${esc(x)}"`:''} ${canAct(r)?'':'disabled'}>${esc(label)}</button>`; }
function seedN(r,salt,min,max){ return min + hash(r.zid+salt)%(max-min+1); }
function stagePanel(r,def){
  const st=r.st[def.k].s, z=S.zakresy[r.zid];
  if(st==='running') return `<p>${esc(r.st[def.k].label||'Przetwarzanie…')}</p><div class="progress"><i></i></div>`;
  if(st==='todo') return `<div class="note">Etap czeka na zakończenie poprzednich etapów.</div>`;
  const staleNote = st==='stale' ? `<div class="note stale">Wynik etapu jest nieaktualny, bo zmieniły się dane wejściowe wcześniejszego etapu. Wykonaj ponownie etapy od pierwszego oznaczonego „Do wykonania”.</div>` : '';
  const defs=defsOf(r), nx=defs[defs.indexOf(def)+1];
  const next = st==='done' && nx && r.st[nx.k].s!=='done' ? `<div class="row"><button class="btn" data-a="sel" data-x="${nx.k}">Dalej: ${esc(nx.n)} →</button></div>` : '';

function issueList(r){
  const s=r.snap, is=[];
  for(const d of s.missRate) is.push(['crit','Stawki wydziałów',d,`Wydział ${d} występuje w kosztach CES projektu (2 wiersze, 3 412,00 PLN), a słownik nie ma dla niego stawki na 2026.`]);
  if(s.unm.length) is.push(['warn','Mapowanie CES↔P1S',s.unm.length+' WBS',`Koszt ${nf(sum(s.unm.map(x=>x.cost)))} PLN bez mapowania (UNMAPPED, propozycja w tym projekcie). Przypisanie: ADMIN → Mapowanie CES↔P1S.`]);

  for(const w of s.noBudget) is.push(['warn','Harmonogram i budżet',w,'WP bez budżetu (BAC).']);
  return is;
}
const STAGE = {

    <div class="tbl-wrap"><table><thead><tr><th>Plik</th><th>Źródło</th><th>Import</th><th class="r">Wiersze</th><th>SHA-256</th></tr></thead><tbody>
    ${files.map(f=>`<tr><td class="mono">${esc(f.name)}</td><td><span class="tag">${f.src}</span></td><td class="num">${esc(f.at)}</td><td class="r">${nf(f.rows)}</td><td class="mono">${f.sha.slice(0,12)}…</td></tr>`).join('')}</tbody></table></div>
    <ul class="checks">${comp.map(c=>c.ok?`<li><span class="ic ok">✓</span><span>${c.proj}: źródła kompletne (${c.srcs.map(s=>s.s).join(', ')})</span></li>`:`<li><span class="ic warn">!</span><span>${c.proj}: brak importu ${c.srcs.filter(s=>!s.ok).map(s=>s.s).join(', ')} (ostrzeżenie; docelowo blokada)</span></li>`).join('')}
      ${su.length?`<li><span class="ic warn">!</span><span>${su.length} WBS CES UNMAPPED z propozycją w tym projekcie (${nf(sum(su.map(x=>x.cost)))} PLN) – <a href="#" data-a="goMapZ" data-x="${z.id}">przypisz w ADMIN → Mapowanie</a></span></li>`:''}
      <li><span class="ic ok">✓</span><span>Daty księgowania w okresie ${r.period}</span></li></ul>
    ${st==='done'?`<div class="note ok">Przypięto ${files.length} plików. Nowy import w trakcie przebiegu pokaże informację i decyzję: kontynuuj albo przelicz od etapu Dane projektu.</div>`:`<div class="row">${actBtn(r,'doData','Przypnij dane projektu')}</div>`}`;
  },
  dict(r,st,z){
    const ids=relevant(z);
    return `<p>Słowniki nie są importowane z plików. Przypięcie zapisuje znacznik stanu bazy słowników i kopiuje ten stan do MS SQL, bo procedury EV nie czytają SQLite (D27).</p>
    <div class="tbl-wrap"><table><thead><tr><th>Słownik</th><th>Zasięg</th><th class="r">Wiersze</th><th>Ostatnia zmiana</th></tr></thead><tbody>
    ${ids.map(d=>`<tr><td><a href="#" data-a="${d==='map'?'nav':'dict'}" data-x="${d==='map'?'mapa':d}">${esc(dname(d))}</a></td><td class="muted">${d==='map'?'globalny':['stawki','kalendarz','kursy'].includes(d)?'globalny':'projekt'}</td><td class="r num">${st==='done'?r.snap.rows[d]:rowsOf(d)}</td><td class="small">${esc(meta(d).lastAt)} · ${esc(meta(d).lastBy)}</td></tr>`).join('')}</tbody></table></div>
    ${st==='done'?`<div class="note ok">Przypięto stan <b class="mono">#${r.pinRev}</b>. Migawka skopiowana do MS SQL (<span class="mono">dict.StanSlownikow</span>, <span class="mono">dict.*</span>): ${nf(sum(Object.values(r.snap.rows)))} wierszy. Kolejne etapy czytają tylko migawkę.</div>`:`<div class="row">${actBtn(r,'doDict','Przypnij stan i skopiuj migawkę')}</div>`}`;
  },
  val(r,st,z){
    if(st==='ready') return `<p>Poprawność samych słowników zapewnia walidacja przy zapisie. Ten etap sprawdza, czy przypięte słowniki pasują do danych przebiegu: stawki dla wydziałów z kosztów, mapowanie kosztów CES, WP dla elementów z zaawansowaniem, budżety WP.</p><div class="row">${actBtn(r,'doVal','Uruchom walidację')}</div>`;
    const is=issueList(r), errs=is.filter(x=>x[0]==='crit').length;
    const tbl=`<div class="tbl-wrap"><table><thead><tr><th>Waga</th><th>Źródło</th><th>Element</th><th>Opis</th></tr></thead><tbody>${is.map(i=>`<tr><td>${pill(i[0], i[0]==='crit'?'Blokujący':'Ostrzeżenie')}</td><td>${i[1]}</td><td class="mono small">${esc(i[2])}</td><td>${esc(i[3])}</td></tr>`).join('')}</tbody></table></div>`;
    if(st==='error') return `<div class="note crit">${errs} błąd blokujący. Popraw słownik w aplikacji – zapis przejdzie walidację i trafi do historii – a potem przypnij stan ponownie.</div>${tbl}
      <div class="row">${actBtn(r,'valFix','Popraw w aplikacji: Stawki wydziałów',false)}${actBtn(r,'revalidate','Przypnij ponownie i waliduj')}</div>`;
    return `<div class="note ok">Brak błędów blokujących. ${is.length} ostrzeżeń trafia do raportu przebiegu.</div>${is.length?tbl:''}`;
  },
  join(r,st,z){
    if(r.newEl && r.newEl.state==='open' && st==='action') return newElPanel(r,z);
    const rej = r.fin?.state==='rejected' ? `<div class="note crit">Pliki odrzucone (${esc(r.fin.by)}, ${esc(r.fin.at)}): „${esc(r.fin.comment)}”. Popraw dane i połącz ponownie.</div>` : '';
    if(st==='ready') return rej+`<p>Koszt każdego WBS CES trafia do elementu P1S według przypiętego mapowania (wyjątek WBS → reguła projektu), a dalej do WP projektu. Logika w procedurach MS SQL (O14).</p><div class="row">${actBtn(r,'doJoin','Połącz źródła')}</div>`;
    const s=r.snap, tot=s.ces+s.unm.length;
    return rej+`<div class="grid g3">
      <div class="stack"><span class="eyebrow">Koszt CES okresu w EV</span><b class="num" style="font-size:1.3rem">${nf(s.cost)} PLN</b></div>
      <div class="stack"><span class="eyebrow">WBS CES zmapowane</span><b class="num" style="font-size:1.3rem">${s.ces} / ${tot}</b></div>
      <div class="stack"><span class="eyebrow">Work Packages</span><b class="num" style="font-size:1.3rem">${wpsOf(z.id).length}</b></div></div>
      <ul class="checks">${r.newEl?.state==='accepted'? `<li><span class="ic warn">!</span><span>Pominięto elementy bez przypisania: ${nf(r.newEl.cost)} PLN poza EV tego przebiegu (decyzja: ${esc(r.newEl.by)})</span></li>` : `<li><span class="ic ok">✓</span><span>Wszystkie koszty CES wskazujące ten projekt są zmapowane; elementy P1S z zaawansowaniem mają WP</span></li>`}
      <li><span class="ic ok">✓</span><span>Każdy koszt CES pokazany raz – brak relacji 1:wiele (M3)</span></li>
      <li><span class="ic ok">✓</span><span>Suma kontrolna: koszt po połączeniu = koszt z przypiętych plików</span></li></ul>`;
  },
  fin(r,st,z){
    const t=r.week?'T'+r.week:r.period, files=[z.code+'_AC_przeglad_'+t+'.xlsx', z.code+'_ETC_wstepne_'+t+'.xlsx', z.code+'_WBS_bez_mapowania.xlsx'];
    if(st==='ready') return `<p>Pliki trafią do <span class="mono">Projekty\\${esc(z.code)}\\Finanse\\${r.period}\\</span>. Kolejne etapy są zablokowane do czasu potwierdzenia, że pliki są poprawne.</p><div class="row">${actBtn(r,'doFin','Generuj pliki dla finansów')}</div>`;
    const list=`<ul class="checks">${files.map(f=>`<li><span class="ic ok">✓</span><span class="mono">${esc(f)}</span></li>`).join('')}</ul><p class="muted small">„WBS_bez_mapowania” zawiera elementy UNMAPPED ze stanu mapowania przypiętego w przebiegu.</p>`;
    if(st==='done') return list+`<div class="note ok">Potwierdził(a): ${esc(r.fin?.by||'—')} · ${esc(r.fin?.at||'')}</div>`;
    return list+`<div class="note info">Oczekuje na potwierdzenie. Może potwierdzić dowolna osoba z finansów, także prowadząca przebieg. Zapisujemy kto i kiedy.</div>
      <div class="field"><label for="fin-c">Komentarz (wymagany przy odrzuceniu)</label><textarea id="fin-c" placeholder="np. Koszt W-417 do wyjaśnienia"></textarea></div>
      <div class="row"><button class="btn primary" data-a="finOk">Zatwierdź</button><button class="btn danger" data-a="finNo">Odrzuć – wróć do łączenia</button></div>`;
  },
  prod(r,st,z){
    const tot=wpsOf(z.id).length, miss=Math.min(3,Math.max(2,Math.round(tot*0.3)));
    if(st==='ready') return `<p>Zaawansowanie z raportu produkcyjnego po elementach P1S przypisanych do WP. Źródło do ustalenia (O10, np. <span class="mono">PZLPROD.LOG.vAHDD</span>).</p><div class="row">${actBtn(r,'doProd','Pobierz zaawansowanie z produkcji')}</div>`;
    return `<div class="note ok">Pobrano zaawansowanie dla ${tot-miss} z ${tot} WP. Brak wartości dla ${miss} WP – uzupełnij w następnym etapie.</div>`;
  },
  fill(r,st,z){
    const w=wpsOf(z.id), tot=w.length, miss=Math.min(3,Math.max(2,Math.round(tot*0.3)));
    const rows=w.slice(0,miss).map((v,i)=>({wp:v.wp, cam:v.cam, last:seedN(r,'l'+i,20,85)}));
    if(st==='done') return `<div class="note ok">Uzupełniono ${miss} WP. Każda wartość ma zapisane pochodzenie: ANALITYK (kto, kiedy, metoda).</div>`;
    return `<p>Braki od CAM i produkcji uzupełnia analityk. Wartość analityka nigdy nie nadpisuje wartości od CAM bez śladu. Zasady uzupełniania – decyzja O11.</p>
    <div class="tbl-wrap"><table><thead><tr><th>WP</th><th>CAM</th><th class="r">Ostatnio</th><th>Metoda</th><th class="r">Wartość %</th></tr></thead><tbody>
    ${rows.map((x,i)=>`<tr><td class="mono">${x.wp}</td><td>${esc(x.cam)}</td><td class="r">${x.last}%</td><td><select id="fm-${i}" aria-label="Metoda dla ${x.wp}" ${canAct(r)?'':'disabled'}><option>Ostatnia znana wartość</option><option>Wartość ręczna</option><option>Plik CAM (opcjonalny)</option></select></td><td class="r"><input type="text" id="fv-${i}" value="${x.last}" style="width:70px;text-align:right" aria-label="Wartość ${x.wp}" ${canAct(r)?'':'disabled'}></td></tr>`).join('')}
    </tbody></table></div><div class="row">${actBtn(r,'doFill','Zapisz uzupełnienia')}</div>`;
  },
  camout(r,st,z){
    const cams=camsOf(z.id);
    if(st==='ready') return `<p>Jeden plik na CAM z WP przypisanymi w słowniku „WP i CAM” (migawka przebiegu). Szablon ma ukryty arkusz z identyfikatorem przebiegu; komórki poza polami do uzupełnienia są zablokowane.</p>
      <div class="tbl-wrap"><table><thead><tr><th>CAM</th><th class="r">WP</th><th>Plik</th></tr></thead><tbody>${cams.map(c=>`<tr><td>${esc(c[0])}</td><td class="r">${c[1]}</td><td class="mono">${esc(z.code)}_${r.period}_CAM_${esc(c[0].replace(/[ .]/g,''))}.xlsx</td></tr>`).join('')}</tbody></table></div>
      <div class="row">${actBtn(r,'doCamOut','Generuj pliki dla CAM')}</div>`;
    return `<div class="note ok">Wygenerowano ${cams.length} plików w <span class="mono">CAM\\${r.period}\\Wyslane\\</span>. Termin zwrotu: 06.10.2026. CAM pracują tylko na plikach.</div>`;
  },
  camin(r,st,z){
    const c=r.cams || camsOf(z.id).map(x=>({n:x[0], wp:x[1], s:'sent'}));
    const lab={sent:['todo','Wysłany'],back:['info','Zwrócony'],ok:['ok','Zaimportowany'],rej:['crit','Odrzucony']};
    const tbl=`<div class="tbl-wrap"><table><thead><tr><th>CAM</th><th class="r">WP</th><th>Status</th><th>Uwagi</th></tr></thead><tbody>${c.map(x=>`<tr><td>${esc(x.n)}</td><td class="r">${x.wp}</td><td>${pill(lab[x.s][0],lab[x.s][1])}</td><td>${esc(x.msg||'')}</td></tr>`).join('')}</tbody></table></div>`;
    if(st==='done') return tbl+`<div class="note ok">Zaimportowano pliki wszystkich CAM.</div>`;
    const scanned=!!r.cams;
    return `<p>Aplikacja sprawdza folder <span class="mono">CAM\\${r.period}\\Zwrocone\\</span>. Import odrzuca pliki z innego przebiegu lub zmienione poza polami do uzupełnienia.</p>${tbl}
      <div class="row">${actBtn(r, scanned?'camRescan':'camScan', scanned?'Symuluj: CAM poprawili pliki – skanuj ponownie':'Skanuj folder Zwrócone')}</div>
      ${scanned?'<p class="muted small">Przebieg może czekać kilka dni. Aplikację można zamknąć – stan jest w bazie.</p>':''}`;
  },
  camval(r,st,z){
    const close=r.kind==='close', pr=close?[100,0,0]:[0,70,30];
    const bar=`<div class="prov" role="img" aria-label="Pochodzenie zaawansowania"><span style="width:${pr[0]}%;background:var(--ok)"></span><span style="width:${pr[1]}%;background:var(--info)"></span><span style="width:${pr[2]}%;background:var(--warn)"></span></div>
      <div class="legend"><span><i style="background:var(--ok)"></i>CAM ${pr[0]}%</span><span><i style="background:var(--info)"></i>Produkcja ${pr[1]}%</span><span><i style="background:var(--warn)"></i>Analityk ${pr[2]}%</span></div>`;
    const checks=`<ul class="checks"><li><span class="ic ok">✓</span><span>Zaawansowanie w zakresie 0–100%</span></li>
      <li><span class="ic warn">!</span><span>1 WP ze spadkiem zaawansowania względem poprzedniego okresu</span></li>
      <li><span class="ic ${close?'ok':'warn'}">${close?'✓':'!'}</span><span>${close?'Bramka zamknięcia: 100% wartości od CAM':'Przebieg tygodniowy: wartości spoza CAM dozwolone, EV oznaczone jako wstępne'}</span></li></ul>`;
    if(st==='ready') return bar+`<div class="row">${actBtn(r,'doCamVal','Waliduj zaawansowanie')}</div>`;
    return bar+checks;
  },
  ev(r,st,z){
    if(st==='ready') return `<p>Kalkulacja w bazie na migawce słowników <span class="mono">#${r.pinRev}</span> i przypiętych plikach, więc wynik można odtworzyć 1:1.</p><div class="row">${actBtn(r,'doEv', r.rev?'Przelicz – nowa rewizja':'Generuj EV')}</div>`;
    const rows=z.p1s.map(p=>{ const bac=seedN(r,p+'b',40,160)*1e6, bcws=bac*seedN(r,p+'s',30,70)/100, bcwp=bcws*seedN(r,p+'p',88,106)/100, acwp=bcwp*seedN(r,p+'a',92,112)/100; return {p,bac,bcws,bcwp,acwp}; });
    const f=x=>nf(Math.round(x/1000));
    return `<div class="row between"><span>Rewizja <b>R${r.rev||1}</b> · ${r.kind==='weekly'?'EV wstępne (nieformalne)':'EV formalne'} · stan słowników #${r.pinRev}</span><span class="mono muted">${esc(z.code)}_EV_${r.week?'T'+r.week:r.period}_R${r.rev||1}.xlsx</span></div>
      <div class="tbl-wrap"><table><thead><tr><th>Projekt P1S</th><th class="r">BAC</th><th class="r">BCWS</th><th class="r">BCWP</th><th class="r">ACWP</th><th class="r">CPI</th><th class="r">SPI</th></tr></thead><tbody>
      ${rows.map(x=>{const cpi=x.bcwp/x.acwp, spi=x.bcwp/x.bcws;return `<tr><td class="mono">${x.p}</td><td class="r">${f(x.bac)}</td><td class="r">${f(x.bcws)}</td><td class="r">${f(x.bcwp)}</td><td class="r">${f(x.acwp)}</td><td class="r" style="color:var(${cpi<0.95?'--crit':cpi<1?'--warn':'--ok'})">${cpi.toFixed(2)}</td><td class="r" style="color:var(${spi<0.95?'--crit':spi<1?'--warn':'--ok'})">${spi.toFixed(2)}</td></tr>`}).join('')}
      </tbody></table></div><p class="muted" style="font-size:.82rem">Wartości w tys. ${z.type==='SAC'?'USD':'PLN'}. Dane przykładowe.</p>
      ${r.frozen?'<div class="note ok">Okres zamknięty i zamrożony. Ponowne przeliczenie utworzy nową rewizję, poprzednia zostaje w historii.</div>':
       `<div class="row">${actBtn(r,'doEvAgain','Przelicz ponownie (nowa rewizja)',false)}${r.kind==='close' && runState(r).s==='done'? `<button class="btn primary" data-a="freeze">Zatwierdź zamknięcie okresu</button>`:''}</div>`}`;
  },
  cobra(r,st,z){
    if(st==='ready') return `<p>Plik dla Cobra: koszt pracy przeliczony po bieżących stawkach na USD, zaawansowanie wg WP.</p><div class="row">${actBtn(r,'doCobra','Generuj plik dla Cobra')}</div>`;
    return `<div class="note ok">Wygenerowano <span class="mono">${esc(z.code)}_${r.period}_Cobra_import.csv</span> w <span class="mono">EV\\${r.period}\\</span>.</div>`;
  }
};
function newElPanel(r,z){
  const s=r.snap, close=r.kind==='close', cost=sum(s.unm.map(x=>x.cost));
  return `<div class="note warn">Przypięty stan mapowania nie obejmuje części danych projektu. Koszt <b>${nf(cost)} PLN</b> i zaawansowanie tych elementów nie trafią do EV, dopóki nie zostaną przypisane.</div>
    ${s.unm.length?`<h3>Koszty CES bez mapowania (UNMAPPED)</h3><div class="tbl-wrap"><table><thead><tr><th>WBS CES</th><th>Project Definition</th><th class="r">Koszt okresu</th><th>Propozycja</th></tr></thead><tbody>${s.unm.map(x=>`<tr><td class="mono">${x.c}</td><td class="mono">${x.pd}</td><td class="r">${nf(x.cost)} PLN</td><td class="mono">${x.prop||'—'}</td></tr>`).join('')}</tbody></table></div>`:''}
    ${s.noWp.length?`<h3>Elementy P1S z zaawansowaniem bez WP</h3><div class="tbl-wrap"><table><thead><tr><th>Element P1S</th><th>Opis</th><th class="r">Zaawansowanie</th></tr></thead><tbody>${s.noWp.map(x=>`<tr><td class="mono">${x.c}</td><td>${esc(x.n)}</td><td class="r">${x.prog}%</td></tr>`).join('')}</tbody></table></div>`:''}
    <ul class="checks"><li><span class="ic ok">✓</span><span>Żaden projekt P1S tego projektu nie należy do innego projektu</span></li></ul>
    <div class="row">${s.unm.length?actBtn(r,'goMap','Przypisz: ADMIN → Mapowanie CES↔P1S'):''}${s.noWp.length?actBtn(r,'goWp','Dodaj WP w słowniku projektu',false):''}${actBtn(r,'neSim','Symuluj: przypisania uzupełnione',false)}${close?'':actBtn(r,'neAccept','Kontynuuj bez tych elementów',false)}</div>
    <p class="muted small">Po zapisaniu przypisań przebieg pokaże, że słowniki zmieniły się po przypięciu. „Przypnij ponownie” odświeży migawkę i przeliczy etapy od walidacji.${close?' Na zamknięcie miesiąca koszt UNMAPPED blokuje (reguła do potwierdzenia – P10).':''}</p>`;
}

/* ---------- SŁOWNIKI (edytor) / INFO ---------- */
function cellFmt(c,x){ if(x==null||x==='') return '<span class="muted">—</span>'; if(c.t==='num') return nf(Number(x), c.d??0); return esc(x); }
function vDict(id){
  const d=S.dicts[id]; if(!d) return vSlowniki();
  const def=DEFS[d.kind], v=S.view;
  const crumb = d.scope==='global' ? `<a href="#" data-a="nav" data-x="slowniki">ADMIN · Słowniki</a>` : d.scope==='config' ? `<a href="#" data-a="nav" data-x="slowniki">ADMIN · Słowniki</a> / konfiguracja importu` : `<a href="#" data-a="zakres" data-x="${d.scope}">Projekty / ${esc(S.zakresy[d.scope].code)}</a>`;
  const rows=d.rows.filter(r=>v.all || isActive(r)).sort((a,b)=>def.key.map(k=>String(a.v[k])).join('|').localeCompare(def.key.map(k=>String(b.v[k])).join('|')) || a.vf.localeCompare(b.vf));
  const pf=v.prefill||{}, edit=v.edit && d.rows.find(r=>r.id===v.edit);
  const back = v.back && S.runs[v.back] ? `<a href="#" data-a="run" data-x="${v.back}">← Wróć do przebiegu ${esc(v.back)}</a> · ` : '';
  const field=c=>{ const val=pf[c.k]??''; const idx=`df-${c.k}`;
    if(c.t==='list') return `<div class="field"><label for="${idx}">${esc(c.l)}</label><select id="${idx}"><option value="">— wybierz —</option>${opts(c.src,d).map(o=>`<option ${o===val?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`;
    return `<div class="field"><label for="${idx}">${esc(c.l)}${c.opt?' <span class="muted">(opcjonalnie)</span>':''}</label><input type="text" id="${idx}" value="${esc(val)}" ${c.t==='date'?'placeholder="RRRR-MM-DD"':''} ${['num','int'].includes(c.t)?'inputmode="decimal"':''}></div>`; };
  return `
  <div class="head"><div><div class="eyebrow">${back}${crumb}</div><h1>${esc(def.name)}</h1>
    <p class="sub">Klucz: ${def.key.map(k=>def.cols.find(c=>c.k===k).l).join(' + ')}. Ostatnia zmiana ${esc(d.lastAt)} · ${esc(d.lastBy)} · stan #${d.lastRev||'—'}.</p></div>
    <label class="inline"><input type="checkbox" id="d-all" data-dall ${v.all?'checked':''}> pokaż historię (wiersze zamknięte)</label></div>
  <section class="panel"><div class="row between"><h2>${edit?'Zmiana wiersza':'Nowy wiersz'}</h2>${edit?`<span class="muted small">Poprzedni wiersz zostanie zamknięty z dniem poprzedzającym „Ważny od”.</span>`:''}</div>
    <div class="form-grid">${def.cols.map(field).join('')}<div class="field"><label for="df-vf">Ważny od</label><input type="text" id="df-vf" value="${esc(pf.vf||TODAY)}" placeholder="RRRR-MM-DD"></div></div>
    ${v.err?`<div class="note crit"><b>Nie zapisano.</b><ul style="margin:4px 0 0;padding-left:18px">${v.err.map(e=>`<li>${esc(e)}</li>`).join('')}</ul></div>`:''}
    <div class="row"><button class="btn primary" data-a="dsave">${edit?'Zapisz zmianę':'Dodaj wiersz'}</button>${edit||v.prefill?'<button class="btn" data-a="dcancel">Anuluj</button>':''}<span class="muted small">Walidacja przy zapisie: wymagane pola, typy, nakładające się okresy ważności, odwołania.</span></div>
  </section>

function validateRow(d, vals, vf, editId){
  const def=DEFS[d.kind], errs=[], lab=k=>def.cols.find(c=>c.k===k).l;
  for(const c of def.cols){ const x=vals[c.k];
    if(!x){ if(!c.opt) errs.push(`Pole „${c.l}” jest wymagane.`); continue; }
    if(c.t==='num'||c.t==='int'){ const n=Number(x.replace(',','.').replace(/\s/g,''));
      if(isNaN(n) || (c.t==='int' && !Number.isInteger(n))) errs.push(`„${c.l}”: „${x}” nie jest liczbą${c.t==='int'?' całkowitą':''}.`);
      else if(c.min!=null && n<c.min) errs.push(`„${c.l}” musi być ${c.min>0?'większe od 0':'nieujemne'}.`);
      else vals[c.k]=String(n); }
    if(c.t==='p1s'){ vals[c.k]=x.toUpperCase(); if(!nodeOf(vals[c.k])) errs.push(`„${c.l}”: nie ma elementu ${x} w P1S.`); }
    if(c.t==='date' && !/^\d{4}-\d{2}-\d{2}$/.test(x)) errs.push(`„${c.l}”: podaj datę w formacie RRRR-MM-DD.`);
  }
  if(!/^\d{4}-\d{2}-\d{2}$/.test(vf)) errs.push('„Ważny od”: podaj datę w formacie RRRR-MM-DD.');
  for(const [a,b] of def.rules||[]) if(vals[a] && vals[b] && vals[a]>vals[b]) errs.push(`„${lab(a)}” musi być wcześniej niż „${lab(b)}” albo tego samego dnia.`);
  if(errs.length) return errs;
  const others=d.rows.filter(r=>r.id!==editId && (!r.vt || r.vt>=vf));
  const dupK=others.find(r=>def.key.every(k=>String(r.v[k]).toLowerCase()===String(vals[k]).toLowerCase()));
  if(dupK) errs.push(`Nakładające się okresy ważności: ${def.key.map(k=>vals[k]).join(' / ')} ma już wiersz ważny od ${dupK.vf}${dupK.vt?' do '+dupK.vt:' (bez końca)'}. Użyj „Zmień” przy tym wierszu – poprzedni zostanie zamknięty.`);
  for(const u of def.uniq||[]){ const o=others.find(r=>String(r.v[u])===vals[u]); if(o) errs.push(`${lab(u)} ${vals[u]} ma już WP ${o.v.wp}. Jeden element P1S może mieć tylko jeden WP.`); }
  return errs;
}

  doData:()=>{ const r=R(); work(r,'data','Wybór danych projektu i przypinanie plików…',1100,()=>{ r.files=pinFiles(r.zid); complete(r,'data'); logRun(r,'Przypięto '+r.files.length+' plików RABIT (hash).'); }); },
  doDict:()=>{ const r=R(); work(r,'dict','Przypinanie stanu i kopiowanie migawki do MS SQL…',1100,()=>{ pinSnap(r); complete(r,'dict'); logRun(r,'Przypięto stan słowników #'+r.pinRev+'. Migawka skopiowana do MS SQL (dict.*).'); }); },
  doVal:()=>{ const r=R(); work(r,'val','Walidacja spójności słowników z danymi…',1100,()=>{
    const e=r.snap.missRate.length; if(e){ setSt(r,'val','error'); r.sel='val'; logRun(r,'Walidacja: '+e+' błąd blokujący (brak stawki '+r.snap.missRate.join(', ')+' na 2026).'); }
    else { complete(r,'val'); r.sel='val'; logRun(r,'Walidacja bez błędów blokujących ('+issueList(r).length+' ostrzeżeń).'); } }); },
  valFix:()=>{ const r=R(); go({name:'dict', id:'stawki', back:r.id, prefill:{dept:r.snap.missRate[0], year:'2026', vf:TODAY}}); },
  doJoin:()=>{ const r=R(); work(r,'join','Łączenie źródeł w bazie (procedury)…',1300,()=>{
    const s=r.snap, cost=sum(s.unm.map(x=>x.cost));
    if(s.unm.length || s.noWp.length){ r.newEl={state:'open', cost}; setSt(r,'join','action'); logRun(r,`Wykryto elementy bez przypisania: ${s.unm.length} WBS CES UNMAPPED (${nf(cost)} PLN), ${s.noWp.length} elementów P1S bez WP.`); }
    else { r.newEl=null; complete(r,'join'); logRun(r,'Połączono źródła. Wszystkie koszty CES projektu zmapowane.'); } }); },
  goMap:()=>{ const r=R(); Object.assign(S.mp,{z:r.zid, f:'UNMAPPED', q:'', pend:null, selCes:null, selP1s:null, msg:null, cpage:0}); go({name:'mapa', back:r.id}); },
  goWp:()=>{ const r=R(); go({name:'dict', id:r.zid+':wp', back:r.id, prefill:{p1s:r.snap.noWp[0]?.c, vf:TODAY}}); },
  neSim:()=>{ const r=R(), s=r.snap;
    for(const pd of [...new Set(s.unm.map(x=>x.pd))]){ const p=S.ces.find(c=>c.pd===pd); if(p.prop && !projRule(pd)){ addRule('proj',pd,p.prop); bump('map','Reguła projektu '+pd+' → '+p.prop); } }
    const wp=S.dicts[r.zid+':wp'], hm=S.dicts[r.zid+':harm'], ppl=['J. Kowalski','B. Nowicka'];
    s.noWp.forEach((n,i)=>{ const code=S.zakresy[r.zid].code.toUpperCase()+'-WP-3'+String(i+1).padStart(2,'0'); wp.rows.push({id:rid(), v:{wp:code,p1s:n.c,cam:ppl[i%2],cat:'Labor'}, vf:TODAY, vt:null, by:ME_S, at:'29.09.2026'}); hm.rows.push({id:rid(), v:{wp:code,bac:String(900+i*300),start:'2026-10-01',finish:'2027-03-31'}, vf:TODAY, vt:null, by:ME_S, at:'29.09.2026'}); });
    if(s.noWp.length){ bump(r.zid+':wp','Dodano '+s.noWp.length+' WP dla '+s.noWp.map(x=>x.c).join(', ')); bump(r.zid+':harm','Budżety nowych WP'); }
    logRun(r,'Zapisano przypisania w aplikacji (reguła projektu, nowe WP).'); A.rebase(); toast('Przypisania zapisane i przypięte ponownie. Wykonaj walidację i łączenie.'); },
  neAccept:()=>{ const r=R(); r.newEl.state='accepted'; r.newEl.by=ME; complete(r,'join'); r.sel='join'; logRun(r,'Decyzja: kontynuacja bez nieprzypisanych elementów ('+nf(r.newEl.cost)+' PLN poza EV wstępnym).'); save(); render(); },
  doFin:()=>{ const r=R(); work(r,'fin','Generowanie plików dla finansów…',1000,()=>{ setSt(r,'fin','action'); r.fin={state:'pending'}; logRun(r,'Wygenerowano pliki dla finansów – oczekują na zatwierdzenie.'); }); },
  finOk:()=>{ const r=R(); r.fin={state:'approved', by:ME, at:now()}; complete(r,'fin'); logRun(r,'Potwierdzono poprawność plików dla finansów.'); save(); render(); toast('Zatwierdzono. Kolejne etapy odblokowane.'); },
  finNo:()=>{ const r=R(), c=($('#fin-c')?.value||'').trim(); if(!c){ toast('Wpisz komentarz – bez niego nie wiadomo, co poprawić.'); $('#fin-c')?.focus(); return; }
    r.fin={state:'rejected', by:ME, at:now(), comment:c}; invalidateFrom(r,'join'); logRun(r,'Odrzucono pliki dla finansów: „'+c+'”. Powrót do łączenia źródeł.'); save(); render(); },
  doProd:()=>{ const r=R(); work(r,'prod','Pobieranie zaawansowania z raportu produkcyjnego…',1100,()=>{ complete(r,'prod'); logRun(r,'Pobrano zaawansowanie z produkcji. Braki do uzupełnienia.'); }); },
  doFill:()=>{ const r=R(); complete(r,'fill'); logRun(r,'Uzupełniono brakujące WP (pochodzenie: ANALITYK).'); save(); render(); },
  doCamOut:()=>{ const r=R(); work(r,'camout','Generowanie plików dla CAM…',1100,()=>{ complete(r,'camout'); setSt(r,'camin','action'); logRun(r,'Wygenerowano '+camsOf(r.zid).length+' plików dla CAM.'); }); },
  camScan:()=>{ const r=R(), cams=camsOf(r.zid); r.cams=cams.map((c,i)=>({n:c[0], wp:c[1], s: i===cams.length-1?'sent': i===1?'rej':'ok', msg: i===1?'Zmieniona komórka poza polami do uzupełnienia': i===cams.length-1?'Brak pliku w Zwrócone':''}));
    setSt(r,'camin','action'); logRun(r,'Skan Zwrócone: zaimportowano '+r.cams.filter(c=>c.s==='ok').length+', odrzucono 1, brak 1.'); save(); render(); },
  camRescan:()=>{ const r=R(); r.cams.forEach(c=>{c.s='ok'; c.msg=c.msg?'Poprawiony plik zaimportowany':'';}); complete(r,'camin'); logRun(r,'Zaimportowano pliki wszystkich CAM.'); save(); render(); },
  doCamVal:()=>{ const r=R(); work(r,'camval','Walidacja zaawansowania i pochodzenia wartości…',1000,()=>{ complete(r,'camval'); logRun(r,'Walidacja zaawansowania zakończona (1 ostrzeżenie).'); }); },
  doEv:()=>{ const r=R(); work(r,'ev','Kalkulacja EV w bazie…',1300,()=>{ r.rev=(r.rev||0)+1; complete(r,'ev'); r.sel='ev'; logRun(r,'Wygenerowano EV, rewizja R'+r.rev+' (stan słowników #'+r.pinRev+').'); }); },
  doEvAgain:()=>{ const r=R(); invalidateFrom(r,'ev'); logRun(r,'Ponowne przeliczenie EV – powstanie nowa rewizja.'); save(); render(); },
  doCobra:()=>{ const r=R(); work(r,'cobra','Generowanie pliku dla Cobra…',900,()=>{ complete(r,'cobra'); r.sel='cobra'; logRun(r,'Wygenerowano plik dla Cobra.'); }); },
  freeze:()=>{ const r=R(); r.frozen=true; r.sel='ev'; logRun(r,'Zatwierdzono zamknięcie okresu '+r.period+'. Przebieg zamrożony.'); save(); render(); }
};
function finishCreate(rules){
  const w=S.wiz, id=w.code.toUpperCase();
  S.zakresy[id]={id, code:w.code, name:w.name, type:w.type, pool:w.pool, p1s:w.p1s.slice(), created:'29.09.2026 · '+ME_S, isNew:true};
  for(const k of wDicts(w)) S.dicts[id+':'+k]=mkDict(k,id,[],0);
  for(const [c,o] of rules) if(!projRule(c)){ addRule('proj',c,o); }
  if(rules.length) bump('map','Reguły projektu z kreatora '+w.code+': '+rules.map(([c,o])=>c+' → '+o).join(', '));
  ev(w.code,'Utworzono projekt '+w.code+' ('+TYPES[w.type].label+')');
  save();
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]'); if(!el) return;
  if(el.dataset.a==='closeModal' && e.target.closest('[data-stop]') && !e.target.closest('button[data-a="closeModal"]')) return;
  if(el.tagName==='A') e.preventDefault();
  const f=A[el.dataset.a]; if(f && !el.disabled) f(el.dataset.x, el);
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.w!==undefined) S.wiz[t.dataset.w]=t.value;
  for(const [k,set,id] of [['mq',v=>{S.mp.q=v; S.mp.cpage=0;},'#mq'],['pq',v=>{S.mp.pq=v;},'#pq'],['aq',v=>{S.adm.q=v; S.adm.pg=0;},'#aq'],['pf',v=>{S.pul.q=v;},'#pf']])
    if(t.dataset[k]!==undefined){ set(t.value); const pos=t.selectionStart; render(); const n=$(id); if(n){ n.focus(); n.setSelectionRange(pos,pos); } }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.wc!==undefined){ S.wiz[t.dataset.wc]=t.checked; render(); }
  if(t.dataset.wp!==undefined){ const p=t.dataset.wp, w=S.wiz; w.p1s = t.checked? [...new Set([...w.p1s,p])] : w.p1s.filter(x=>x!==p); render(); }
  if(t.dataset.wr!==undefined){ S.wiz.cesR[t.dataset.wr]=t.value; }
  if(t.dataset.aold!==undefined){ S.adm.old=t.checked; render(); }
  if(t.dataset.mz!==undefined){ S.mp.z=t.value; S.mp.cpage=0; render(); }
  if(t.dataset.dall!==undefined){ S.view={...S.view, all:t.checked}; render(); }
});
/* drag & drop: CES (data-drag) → P1S (data-drop) */
let DRAG=null;
function dropOk(t){ if(t.dataset.drop==='__unmap') return true; const n=nodeOf(t.dataset.drop); return !(DRAG.startsWith('pd:') && n && n.l!==1); }
document.addEventListener('dragstart',e=>{ const el=e.target.closest?.('[data-drag]'); if(!el) return; DRAG=el.dataset.drag; e.dataTransfer.setData('text/plain',DRAG); e.dataTransfer.effectAllowed='link'; document.body.classList.add('dragging', DRAG.startsWith('pd:')?'drag-pd':'drag-w'); });
document.addEventListener('dragend',()=>{ DRAG=null; document.body.classList.remove('dragging','drag-pd','drag-w'); document.querySelectorAll('.over').forEach(x=>x.classList.remove('over','bad')); });
document.addEventListener('dragover',e=>{ const t=e.target.closest?.('[data-drop]'); if(!t||!DRAG) return; e.preventDefault(); const ok=dropOk(t); e.dataTransfer.dropEffect='link'; /* błędny cel też przyjmuje drop – komunikat wyjaśnia dlaczego */ t.classList.add('over'); t.classList.toggle('bad',!ok); });
document.addEventListener('dragleave',e=>{ const t=e.target.closest?.('[data-drop]'); if(t && !t.contains(e.relatedTarget)) t.classList.remove('over','bad'); });
document.addEventListener('drop',e=>{ const t=e.target.closest?.('[data-drop]'); if(!t||!DRAG) return; e.preventDefault(); const src=DRAG; DRAG=null; document.body.classList.remove('dragging','drag-pd','drag-w'); const tgt=t.dataset.drop, mp=S.mp; mp.msg=null; mp.manual=false; mp.selCes=src.slice(src.indexOf(':')+1); mp.selP1s=null;
  mp.pend = tgt==='__unmap' ? {op:'remove', src} : {op:'assign', src, target:tgt}; render(); $('#work')?.scrollIntoView({block:'nearest'}); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && S.modal){ S.modal=null; render(); }
  const t=e.target; if((e.key==='Enter'||e.key===' ') && t.matches?.('[role="button"][data-a]')){ e.preventDefault(); t.click(); } });
S = load() || seed();
S.mp={...{f:'all', z:'all', cp:[], page:{}, pq:'', open:{}, q:'', cpage:0, pend:null, props:false, manual:false, mc:'', mpc:''}, ...S.mp}; S.adm=S.adm||{q:''}; S.pul=S.pul||{q:'',sort:'code',dir:1,all:false};
for(const r of Object.values(S.runs)) for(const k in r.st) if(r.st[k].s==='running') r.st[k].s='ready';
render();
</script>
